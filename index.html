<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Criaturas Survivor</title>
<style>
  :root{--bg:#1b1528;--panel:#2a2040;--panel2:#3a2d59;--txt:#f4efff;--mut:#a99bc9;--acc:#ffd93b;--bad:#ff5d6c;--ok:#5fcf6a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,10,28,.82);padding:16px;overflow:auto}
  .ov.on{display:flex}
  .box{background:var(--panel);border:3px solid var(--panel2);border-radius:10px;padding:18px 20px;max-width:760px;width:100%;max-height:100%;overflow:auto}
  h1{margin:0 0 4px;font-size:34px;color:var(--acc);text-align:center;letter-spacing:1px}
  h2{margin:0 0 10px;font-size:22px;color:var(--acc)}
  .sub{color:var(--mut);text-align:center;margin:0 0 14px;font-size:14px}
  button{font:inherit;color:var(--txt);background:var(--panel2);border:2px solid #52408a;border-radius:8px;padding:9px 14px;cursor:pointer}
  button:hover:not(:disabled){background:#4b3a7a;border-color:var(--acc)}
  button:disabled{opacity:.45;cursor:default}
  button.big{font-size:22px;padding:12px 28px;background:#4f9d3b;border-color:#7be061}
  button.big:hover{background:#5fb94a}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .card{text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
  .card b{color:var(--acc)} .card small{color:var(--mut)} .card .k{color:var(--mut);font-size:12px}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;color:#111;margin-right:4px}
  .center{text-align:center}
  .companion{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0}
  .companion canvas{position:static;width:96px;height:96px;image-rendering:pixelated}
  .stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--panel2);padding:5px 0}
  .coin{color:var(--acc)}
  .locked{filter:grayscale(1) brightness(.5)}
  .sel{border-color:var(--acc)!important}
  .hint{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- MENÚ PRINCIPAL -->
<div class="ov on" id="ovMenu"><div class="box">
  <h1>Criaturas Survivor</h1>
  <p class="sub">Sobrevive a las hordas con tu compañero · clon local de aprendizaje</p>
  <div class="companion"><canvas id="menuSprite" width="30" height="30"></canvas><div id="menuName"></div></div>
  <div class="center"><button class="big" id="bPlay">Jugar</button></div>
  <div class="menu">
    <button id="bComp">Compañeros</button>
    <button id="bUp">Mejoras</button>
    <button id="bGacha">Gacha</button>
    <button id="bStats">Estadísticas</button>
    <button id="bGuide">Guía</button>
    <button id="bSound">Sonido: sí</button>
  </div>
  <p class="hint">Monedas: <span class="coin" id="mCoins">0</span> · Los datos se guardan en este navegador</p>
</div></div>

<!-- PANEL GENÉRICO -->
<div class="ov" id="ovPanel"><div class="box">
  <div class="row"><h2 id="pTitle"></h2><button id="pBack">Volver</button></div>
  <div id="pBody"></div>
</div></div>

<!-- SUBIDA DE NIVEL -->
<div class="ov" id="ovLvl"><div class="box">
  <h2 id="lTitle"></h2>
  <p class="sub" id="lSub"></p>
  <div class="grid" id="lCards"></div>
  <div class="row" style="margin-top:12px"><button id="lReroll">Cambiar opciones (R)</button><button id="lSkip" style="display:none">No, gracias</button></div>
</div></div>

<!-- PAUSA -->
<div class="ov" id="ovPause"><div class="box center">
  <h2>Pausa</h2>
  <p class="sub">WASD / flechas: moverse · 1–4: movimiento principal · Q/E: ciclar · Esc: pausa</p>
  <div class="menu"><button id="bResume">Continuar</button><button id="bSnd2">Sonido</button><button id="bQuit">Abandonar run</button></div>
</div></div>

<!-- FIN DE PARTIDA -->
<div class="ov" id="ovOver"><div class="box center">
  <h2 id="oTitle">Has caído…</h2>
  <div id="oBody"></div>
  <div class="menu"><button id="bAgain" class="big">Otra vez</button><button id="bMenu">Volver al menú</button></div>
</div></div>

<script>
"use strict";
/* ============================================================
   CRIATURAS SURVIVOR — un solo archivo, sin dependencias.
   Secciones: 1 datos · 2 guardado · 3 sprites · 4 audio ·
   5 estado de la run · 6 lógica · 7 dibujo · 8 menús · 9 arranque
   ============================================================ */

const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtT = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');

/* ---------- 1. DATOS ---------- */
const TYPES = {
  fuego:{n:'Fuego',c:'#ff7a3d',h:18}, agua:{n:'Agua',c:'#4aa8ff',h:205}, planta:{n:'Planta',c:'#5fcf6a',h:120},
  electrico:{n:'Eléctrico',c:'#ffd93b',h:50}, sombra:{n:'Sombra',c:'#8a5cc2',h:270}, dragon:{n:'Dragón',c:'#4f6bff',h:230}
};
// Criaturas originales (nada de Nintendo): cada una se dibuja por código a partir de la semilla.
const SPECIES = [
  {id:'brasito',  name:'Brasito',  type:'fuego',     hp:100, spd:150, move:'ascuas',   seed:11, free:true},
  {id:'gotin',    name:'Gotín',    type:'agua',      hp:110, spd:140, move:'pistola',  seed:23, free:true},
  {id:'brotin',   name:'Brotín',   type:'planta',    hp:120, spd:135, move:'latigo',   seed:37, free:true},
  {id:'chispin',  name:'Chispín',  type:'electrico', hp:85,  spd:170, move:'trueno',   seed:41, free:false},
  {id:'sombrio',  name:'Sombrío',  type:'sombra',    hp:95,  spd:155, move:'orbita',   seed:59, free:false},
  {id:'dracolin', name:'Dracolín', type:'dragon',    hp:105, spd:150, move:'aliento',  seed:73, free:false},
];
const MOVES = {
  ascuas: {name:'Ascuas',      evo:'Llamarada',      type:'fuego',     cd:0.95, dmg:12, desc:'Bolas de fuego al enemigo más cercano'},
  pistola:{name:'Pistola Agua',evo:'Hidrobomba',     type:'agua',      cd:1.10, dmg:14, desc:'Chorro que atraviesa enemigos'},
  latigo: {name:'Látigo Cepa', evo:'Látigo Furia',   type:'planta',    cd:1.60, dmg:16, desc:'Onda a tu alrededor que empuja'},
  trueno: {name:'Impactrueno', evo:'Rayo',           type:'electrico', cd:1.40, dmg:20, desc:'Rayos sobre enemigos al azar'},
  orbita: {name:'Tinieblas',   evo:'Esferas Umbrías',type:'sombra',    cd:1,    dmg:9,  desc:'Esferas que giran a tu alrededor'},
  aliento:{name:'Dracoaliento',evo:'Dracoaliento Máx',type:'dragon',   cd:1.30, dmg:10, desc:'Abanico de proyectiles'},
};
const ITEMS = {
  iman:   {name:'Imán',          desc:'Recoges desde mucho más lejos'},
  bayas:  {name:'Bayas',         desc:'Regeneras vida poco a poco'},
  foco:   {name:'Banda Foco',    desc:'+20% de daño'},
  cinta:  {name:'Cinta Veloz',   desc:'Ataques 18% más rápidos'},
  coraza: {name:'Coraza',        desc:'Recibes 20% menos de daño'},
};
const ENEMY_TYPES = [
  {id:'rata',  hp:18, spd:55, dmg:6,  r:10, hue:290, seed:3,  xp:1, from:0},
  {id:'murci', hp:14, spd:95, dmg:5,  r:9,  hue:200, seed:8,  xp:1, from:60},
  {id:'golem', hp:90, spd:38, dmg:12, r:16, hue:30,  seed:15, xp:3, from:150},
  {id:'brujo', hp:40, spd:60, dmg:8,  r:12, hue:330, seed:21, xp:2, from:240, shoots:true},
];
const UPGRADES = [
  {id:'hp',  name:'Vitalidad', desc:'+10% vida máxima por nivel',  base:60},
  {id:'dmg', name:'Fuerza',    desc:'+6% daño por nivel',          base:80},
  {id:'spd', name:'Agilidad',  desc:'+3% velocidad por nivel',     base:50},
  {id:'mag', name:'Atracción', desc:'+12% radio de recogida',      base:40},
  {id:'coin',name:'Fortuna',   desc:'+10% monedas por nivel',      base:70},
];
const MAX_UP = 10;

/* ---------- 2. GUARDADO ---------- */
const KEY = 'criasurvivor-v1';
function defaultSave(){
  return {coins:0, owned:{brasito:{shiny:false}, gotin:{shiny:false}, brotin:{shiny:false}}, sel:'brasito',
          up:{hp:0,dmg:0,spd:0,mag:0,coin:0}, stats:{runs:0,bestT:0,bestL:0,kills:0}, sound:true};
}
function loadSave(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.owned) return Object.assign(defaultSave(), s); }catch(e){}
  return defaultSave();
}
let SAVE = loadSave();
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(SAVE)); }catch(e){} }

/* ---------- 3. SPRITES PROCEDURALES ---------- */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const spriteCache = {};
// Cuadrícula 10x10 simétrica: se rellena media figura al azar y se refleja.
function makeSprite(seed, hue, shiny, N=10, px=3){
  const key = [seed,hue,shiny,N,px].join('|');
  if(spriteCache[key]) return spriteCache[key];
  const R = mulberry(seed*977+13), h = shiny ? (hue+150)%360 : hue;
  const half = N/2, g = Array.from({length:N}, () => Array(N).fill(0));
  for(let y=1;y<N-1;y++) for(let x=0;x<half;x++){
    const cx = (x+0.5)/half, cy = Math.abs((y-N/2+0.5)/(N/2));
    const p = 0.9*cx - 0.55*cy + (R()-0.5)*0.9;
    if(p > 0.18 || (x>=half-1 && y>2 && y<N-2)) g[y][x] = 1;
  }
  for(let y=0;y<N;y++) for(let x=0;x<half;x++) g[y][N-1-x] = g[y][x];
  const c = document.createElement('canvas'); c.width = c.height = N*px;
  const k = c.getContext('2d');
  const body = `hsl(${h},70%,58%)`, shade = `hsl(${h},70%,42%)`, line = `hsl(${h},50%,14%)`;
  const at = (x,y) => x>=0&&y>=0&&x<N&&y<N&&g[y][x];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if(g[y][x]){ k.fillStyle = (y>N*0.62) ? shade : body; k.fillRect(x*px,y*px,px,px); }
    else if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){ k.fillStyle=line; k.fillRect(x*px,y*px,px,px); }
  }
  const ey = Math.floor(N*0.4);   // ojos
  for(const ex of [half-2, half+1]){
    k.fillStyle='#fff'; k.fillRect(ex*px,ey*px,px,px);
    k.fillStyle='#111'; k.fillRect(ex*px+px/2,ey*px+px/2,px/2,px/2);
  }
  return spriteCache[key] = c;
}
const spriteOf = (sp, shiny) => makeSprite(sp.seed, TYPES[sp.type].h, shiny);

/* ---------- 4. AUDIO (osciladores, sin ficheros) ---------- */
let AC = null;
function beep(f, d=0.08, type='square', vol=0.04, slide=0){
  if(!SAVE.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), t+d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
let lastHitSnd = 0;
const sfx = {
  hit(){ const n = performance.now(); if(n-lastHitSnd>60){ lastHitSnd=n; beep(rnd(180,260),0.05,'square',0.025); } },
  gem(){ beep(880,0.05,'triangle',0.03); },
  lvl(){ beep(520,0.1,'square',0.05); setTimeout(()=>beep(780,0.15,'square',0.05),90); },
  hurt(){ beep(140,0.18,'sawtooth',0.06,-80); },
  boss(){ beep(90,0.6,'sawtooth',0.07,-30); },
  die(){ beep(300,0.6,'sawtooth',0.07,-250); },
};

/* ---------- 5. ESTADO ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, Z = 1;
function resize(){
  const d = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d;
  Z = clamp(H/560, 0.8, 2) * d;
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

let G = null;            // estado de la run (null en menús)
const keys = {};
let touch = null;        // joystick táctil {ox,oy,x,y}

function mult(){          // multiplicadores permanentes + objeto
  const u = SAVE.up, it = G.item;
  return {
    hp: 1+0.10*u.hp, dmg: (1+0.06*u.dmg) * (it==='foco'?1.2:1) * (G.shiny?1.1:1),
    spd: 1+0.03*u.spd, mag: (1+0.12*u.mag) * (it==='iman'?1.6:1) * G.magBonus,
    coin: 1+0.10*u.coin, cd: it==='cinta'?0.82:1, armor: it==='coraza'?0.8:1,
  };
}

function newRun(){
  const sp = SPECIES.find(s => s.id===SAVE.sel) || SPECIES[0];
  const shiny = !!(SAVE.owned[sp.id] && SAVE.owned[sp.id].shiny);
  G = {
    sp, shiny, t:0, over:false, paused:false, locked:false,
    px:0, py:0, face:1, inv:0, maxhp:0, hp:0, spdBonus:1, magBonus:1, dmgBonus:1,
    lvl:1, xp:0, pending:[], kills:0, coins:0, rerolls:1, item:null,
    moves:[{id:sp.move, lvl:1, t:0.3, links:[]}],   // cada elemento = un hueco; links = movimientos unidos (Vínculo)
    sel:0, enemies:[], proj:[], ebul:[], gems:[], fx:[], txt:[], spawnAcc:0, nextBoss:180, bossN:0, banner:null, orbAng:0, cam:{x:0,y:0},
  };
  const m = mult(); G.maxhp = Math.round(sp.hp*m.hp); G.hp = G.maxhp;
  ['#ovMenu','#ovPanel','#ovLvl','#ovPause','#ovOver'].forEach(s => $(s).classList.remove('on'));
}

/* ---------- 6. LÓGICA ---------- */
const flat = () => G.moves.flatMap(g => [g, ...g.links]);   // todos los movimientos (con vinculados)
function moveDmg(m, focus){
  const base = MOVES[m.id].dmg * (1+0.22*(m.lvl-1)) * (m.lvl>=5?1.35:1);
  return base * mult().dmg * G.dmgBonus * (focus?1.25:1);
}
const moveName = m => m.lvl>=5 ? MOVES[m.id].evo : MOVES[m.id].name;

function nearest(x, y, maxD=520){
  let best=null, bd=maxD*maxD;
  for(const e of G.enemies){ const d=(e.x-x)**2+(e.y-y)**2; if(d<bd){bd=d;best=e;} }
  return best;
}
function shoot(x,y,ang,speed,dmg,r,pierce,life,col){
  G.proj.push({x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,dmg,r,pierce,life,col,hit:[]});
}
function fire(m, focus){
  const d = moveDmg(m, focus), L = m.lvl, evo = L>=5, col = TYPES[MOVES[m.id].type].c;
  const t = nearest(G.px, G.py);
  const baseAng = t ? Math.atan2(t.y-G.py, t.x-G.px) : (G.face>0?0:Math.PI);
  switch(m.id){
    case 'ascuas': {
      const n = 1 + Math.floor(L/2) + (evo?1:0);
      for(let i=0;i<n;i++){ const tt = nearest(G.px,G.py) && (G.enemies.length>i ? G.enemies[(i*7)%G.enemies.length] : t);
        const a = tt ? Math.atan2(tt.y-G.py, tt.x-G.px) : baseAng + (i-(n-1)/2)*0.25;
        shoot(G.px,G.py,a+rnd(-0.06,0.06),330,d,evo?8:6,1,1.4,col); }
      beep(500,0.07,'square',0.02,-200); break; }
    case 'pistola': {
      if(!t) return;
      const n = evo?2:1;
      for(let i=0;i<n;i++) shoot(G.px,G.py,baseAng+(i-(n-1)/2)*0.2,400,d,evo?9:7,2+L,1.3,col);
      beep(380,0.08,'triangle',0.025,120); break; }
    case 'latigo': {
      const R = 70 + 12*L + (evo?25:0);
      for(const e of G.enemies){ const dx=e.x-G.px, dy=e.y-G.py, dist=Math.hypot(dx,dy);
        if(dist<R+e.r){ hurt(e,d); e.kx+=dx/(dist||1)*220; e.ky+=dy/(dist||1)*220; } }
      G.fx.push({k:'ring',x:G.px,y:G.py,r:10,max:R,life:0.3,t:0.3,col});
      beep(200,0.12,'sawtooth',0.03,-60); break; }
    case 'trueno': {
      const n = 1 + L + (evo?1:0); const near = G.enemies.filter(e => (e.x-G.px)**2+(e.y-G.py)**2 < 340*340);
      for(let i=0;i<n && near.length;i++){ const e = near.splice(Math.floor(Math.random()*near.length),1)[0];
        hurt(e,d); G.fx.push({k:'bolt',x:e.x,y:e.y,life:0.18,t:0.18,col}); }
      if(n) beep(900,0.1,'sawtooth',0.03,-500); break; }
    case 'aliento': {
      if(!t) return;
      const n = 3 + Math.floor(L/2) + (evo?2:0), spread = 0.7 + 0.06*L;
      for(let i=0;i<n;i++) shoot(G.px,G.py,baseAng+(i-(n-1)/2)*(spread/Math.max(1,n-1)),300,d,5,2,0.9,col);
      beep(260,0.12,'sawtooth',0.025,-100); break; }
    // 'orbita' es continua: se resuelve en updateOrbs()
  }
}
function updateOrbs(dt){
  G.orbAng += dt*2.6;
  for(const m of flat()){ if(m.id!=='orbita') continue;
    const evo = m.lvl>=5, n = 2 + Math.floor(m.lvl/2) + (evo?1:0), R = 52 + 4*m.lvl;
    const d = moveDmg(m, G.moves[G.sel] && (G.moves[G.sel]===m || G.moves[G.sel].links.includes(m)));
    for(let i=0;i<n;i++){ const a = G.orbAng + i*Math.PI*2/n, ox = G.px+Math.cos(a)*R, oy = G.py+Math.sin(a)*R;
      m._orbs = m._orbs || []; m._orbs[i] = {x:ox,y:oy};
      for(const e of G.enemies){ if(e.orbT>0) continue;
        if((e.x-ox)**2+(e.y-oy)**2 < (e.r+8)**2){ hurt(e,d); e.orbT = 0.35; const dd=Math.hypot(e.x-G.px,e.y-G.py)||1; e.kx+=(e.x-G.px)/dd*120; e.ky+=(e.y-G.py)/dd*120; } } }
    m._orbs.length = n; }
}

function hurt(e, d){
  e.hp -= d; e.flash = 0.1; sfx.hit();
  if(G.txt.length<40) G.txt.push({x:e.x+rnd(-6,6),y:e.y-e.r,s:String(Math.round(d)),t:0.5});
  if(e.hp<=0 && !e.dead) kill(e);
}
function kill(e){
  e.dead = true; G.kills++;
  G.gems.push({x:e.x,y:e.y,v:e.boss?30:e.xp,coin:false});
  const m = mult();
  if(e.boss){ for(let i=0;i<8;i++) G.gems.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),v:0,coin:true,c:Math.ceil(5*m.coin)}); }
  else if(Math.random() < 0.07*m.coin) G.gems.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),v:0,coin:true,c:1});
}

function spawn(dt){
  const t = G.t;
  G.spawnAcc += dt * (1.4 + t/22);
  const cap = Math.min(80 + t*0.9, 320);
  while(G.spawnAcc >= 1){ G.spawnAcc -= 1; if(G.enemies.length >= cap) continue;
    const pool = ENEMY_TYPES.filter(e => t >= e.from);
    const w = pool.map((e,i) => i===pool.length-1 ? 1.2 : (i===0 ? 2 : 1.3));
    let r = Math.random()*w.reduce((a,b)=>a+b,0), et = pool[0];
    for(let i=0;i<pool.length;i++){ r -= w[i]; if(r<=0){ et = pool[i]; break; } }
    const a = rnd(0, Math.PI*2), dist = Math.max(W,H)/Z/2*1.1 + 40;
    const sc = 1 + t/110;
    G.enemies.push({...et, x:G.px+Math.cos(a)*dist, y:G.py+Math.sin(a)*dist, hp:et.hp*sc, maxhp:et.hp*sc, kx:0,ky:0, flash:0, orbT:0, shootT:rnd(1,3), ph:rnd(0,6.28)});
  }
  if(t >= G.nextBoss){
    G.nextBoss += 240; G.bossN++;
    const a = rnd(0,Math.PI*2), dist = Math.max(W,H)/Z/2 + 80, hp = 900 + G.bossN*900 + t*2;
    G.enemies.push({id:'boss',boss:true,hp,maxhp:hp,spd:42,dmg:20,r:34,hue:350,seed:99,xp:30,x:G.px+Math.cos(a)*dist,y:G.py+Math.sin(a)*dist,kx:0,ky:0,flash:0,orbT:0,shootT:2,ph:0});
    G.banner = {s:'¡Un legendario se acerca!', t:3}; sfx.boss();
  }
}

function playerHit(d){
  if(G.inv>0) return;
  G.hp -= d*mult().armor; G.inv = 0.6; sfx.hurt();
  G.fx.push({k:'flash',life:0.15,t:0.15});
  if(G.hp<=0) endRun();
}

function addXP(v){
  G.xp += v;
  while(G.xp >= xpNeed(G.lvl)){ G.xp -= xpNeed(G.lvl); G.lvl++; G.pending.push(G.lvl); G.hp = Math.min(G.maxhp, G.hp + G.maxhp*0.1); }
}
const xpNeed = l => 6 + l*5;

function update(dt){
  const g = G, m = mult();
  g.t += dt;
  if(g.inv>0) g.inv -= dt;
  // movimiento
  let ix = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0), iy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
  if(touch){ const dx = touch.x-touch.ox, dy = touch.y-touch.oy, l = Math.hypot(dx,dy); if(l>8){ ix = dx/Math.max(l,40); iy = dy/Math.max(l,40); } }
  const il = Math.hypot(ix,iy); if(il>1){ ix/=il; iy/=il; }
  const spd = g.sp.spd * m.spd;
  g.px += ix*spd*dt; g.py += iy*spd*dt; if(ix) g.face = ix>0?1:-1;
  if(g.item==='bayas') g.hp = Math.min(g.maxhp, g.hp + 1.5*dt);
  // ataques
  g.moves.forEach((gr, i) => { gr.t -= dt;
    if(gr.t <= 0){ const focus = (i===g.sel); fire(gr, focus); for(const l of gr.links) fire(l, focus);
      gr.t = MOVES[gr.id].cd * m.cd; } });
  updateOrbs(dt);
  spawn(dt);
  // enemigos
  for(const e of g.enemies){
    const dx = g.px-e.x, dy = g.py-e.y, dist = Math.hypot(dx,dy)||1;
    e.ph += dt*3; e.flash -= dt; e.orbT -= dt;
    const wob = Math.sin(e.ph)*0.25;
    e.x += (dx/dist*e.spd*(1+wob*0.3) + e.kx)*dt; e.y += (dy/dist*e.spd*(1+wob*0.3) + e.ky)*dt;
    e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
    if(dist < e.r+12) playerHit(e.dmg);
    if(e.shoots || e.boss){ e.shootT -= dt;
      if(e.shootT<=0 && dist<420){
        if(e.boss){ e.shootT = 2.4; const n=14, o=Math.random()*6; for(let i=0;i<n;i++) ebul(e.x,e.y,o+i*Math.PI*2/n,130,12); }
        else { e.shootT = rnd(2,3.2); ebul(e.x,e.y,Math.atan2(dy,dx),140,8); } } }
  }
  // proyectiles propios
  for(const p of g.proj){
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    for(const e of g.enemies){ if(e.dead || p.hit.includes(e)) continue;
      if((e.x-p.x)**2+(e.y-p.y)**2 < (e.r+p.r)**2){ hurt(e,p.dmg); p.hit.push(e); p.pierce--; if(p.pierce<=0){ p.life=0; break; } } }
  }
  // balas enemigas
  for(const b of g.ebul){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if((b.x-g.px)**2+(b.y-g.py)**2 < (b.r+10)**2){ playerHit(b.dmg); b.life=0; } }
  // gemas / monedas con imán
  const R = 60*m.mag;
  for(const gm of g.gems){ const dx=g.px-gm.x, dy=g.py-gm.y, d=Math.hypot(dx,dy);
    if(d < R || gm.pull){ gm.pull = gm.pull || d<R; const s = 320; gm.x += dx/(d||1)*s*dt; gm.y += dy/(d||1)*s*dt; }
    if(d < 14){ gm.got = true; if(gm.coin){ g.coins += gm.c; beep(1200,0.05,'triangle',0.03); } else { addXP(gm.v); sfx.gem(); } } }
  // limpieza
  g.enemies = g.enemies.filter(e => !e.dead && (e.x-g.px)**2+(e.y-g.py)**2 < 1400*1400);
  g.proj = g.proj.filter(p => p.life>0);
  g.ebul = g.ebul.filter(b => b.life>0);
  g.gems = g.gems.filter(x => !x.got);
  for(const f of g.fx) f.t -= dt; g.fx = g.fx.filter(f => f.t>0);
  for(const x of g.txt){ x.t -= dt; x.y -= 24*dt; } g.txt = g.txt.filter(x => x.t>0);
  if(g.banner){ g.banner.t -= dt; if(g.banner.t<=0) g.banner = null; }
  // cámara suave
  g.cam.x += (g.px-g.cam.x)*Math.min(1, dt*8); g.cam.y += (g.py-g.cam.y)*Math.min(1, dt*8);
  if(g.pending.length && !g.over) openLevelUp();
}
function ebul(x,y,a,s,dmg){ G.ebul.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:5,dmg,life:5}); }

/* ---------- Subida de nivel ---------- */
let curOffer = null;
function offerOptions(lvl){
  const o = [];
  // Nivel 5/15/25: objeto. Nivel 10/20/30: Vínculo (si hay ≥2 huecos).
  if(lvl % 10 === 5) return {kind:'item', opts:shuffle(Object.keys(ITEMS)).slice(0,2).map(id => ({k:'item', id}))};
  if(lvl % 10 === 0 && G.moves.length >= 2){
    const pairs = [];
    for(let i=0;i<G.moves.length;i++) for(let j=0;j<G.moves.length;j++) if(i!==j) pairs.push({k:'link',a:i,b:j});
    return {kind:'link', opts:shuffle(pairs).slice(0,3)};
  }
  for(const gr of G.moves) for(const m of [gr,...gr.links]) if(m.lvl<5) o.push({k:'up', m});
  if(G.moves.length < 4) for(const id of Object.keys(MOVES)) if(!flat().some(m => m.id===id)) o.push({k:'new', id});
  o.push({k:'heal'},{k:'spd'},{k:'mag'},{k:'dmg'});
  return {kind:'normal', opts:shuffle(o).slice(0,3)};
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function describe(o){
  const tag = id => { const t = TYPES[MOVES[id].type]; return `<span class="tag" style="background:${t.c}">${t.n}</span>`; };
  switch(o.k){
    case 'up':   return `<b>${moveName(o.m)}</b>${tag(o.m.id)}<small>Nivel ${o.m.lvl} → ${o.m.lvl+1}${o.m.lvl+1>=5?' · ¡EVOLUCIONA!':''}</small>`;
    case 'new':  return `<b>${MOVES[o.id].name}</b>${tag(o.id)}<small>${MOVES[o.id].desc}</small>`;
    case 'heal': return `<b>Cura</b><small>Recupera el 40% de la vida</small>`;
    case 'spd':  return `<b>Zapatillas</b><small>+8% velocidad</small>`;
    case 'mag':  return `<b>Atracción</b><small>+25% radio de recogida</small>`;
    case 'dmg':  return `<b>Entrenamiento</b><small>+8% daño a todo</small>`;
    case 'item': return `<b>${ITEMS[o.id].name}</b><small>${ITEMS[o.id].desc}</small>`;
    case 'link': return `<b>${moveName(G.moves[o.a])} + ${moveName(G.moves[o.b])}</b><small>Se lanzan a la vez y ocupan un solo hueco</small>`;
  }
}
function openLevelUp(offer){
  G.paused = true;
  const lvl = G.pending[0];
  if(!offer) offer = offerOptions(lvl);
  curOffer = offer;
  const titles = {normal:`¡Nivel ${lvl}!`, item:'¡Un objeto!', link:'¡Vínculo!'};
  const subs = {normal:'Elige una recompensa · 1 2 3', item:'Sólo puedes llevar uno' + (G.item?` (llevas: ${ITEMS[G.item].name})`:''), link:'Los movimientos unidos se lanzan a la vez y ocupan un solo hueco'};
  $('#lTitle').textContent = titles[offer.kind]; $('#lSub').textContent = subs[offer.kind];
  const box = $('#lCards'); box.innerHTML = '';
  offer.opts.forEach((o,i) => { const b = document.createElement('button'); b.className='card'; b.innerHTML = `<span class="k">${i+1}</span>${describe(o)}`;
    b.onclick = () => chooseOffer(o); box.appendChild(b); });
  $('#lReroll').style.display = offer.kind==='normal' ? '' : 'none';
  $('#lReroll').textContent = `Cambiar opciones (${G.rerolls}) · R`; $('#lReroll').disabled = G.rerolls<=0;
  $('#lSkip').style.display = offer.kind!=='normal' ? '' : 'none';
  $('#ovLvl').classList.add('on'); sfx.lvl();
}
function chooseOffer(o){
  switch(o.k){
    case 'up': o.m.lvl++; break;
    case 'new': G.moves.push({id:o.id, lvl:1, t:0.3, links:[]}); break;
    case 'heal': G.hp = Math.min(G.maxhp, G.hp + G.maxhp*0.4); break;
    case 'spd': G.spdBonus *= 1.08; G.sp = {...G.sp, spd:G.sp.spd*1.08}; break;
    case 'mag': G.magBonus *= 1.25; break;
    case 'dmg': G.dmgBonus *= 1.08; break;
    case 'item': G.item = o.id; break;
    case 'link': { const A = G.moves[o.a], B = G.moves[o.b]; A.links.push(B, ...B.links); B.links = []; G.moves.splice(o.b,1); G.sel = 0; break; }
  }
  closeLevelUp();
}
function closeLevelUp(){
  G.pending.shift(); $('#ovLvl').classList.remove('on'); G.paused = false;
  if(G.pending.length) openLevelUp();
}

/* ---------- Fin de run ---------- */
function endRun(){
  if(G.over) return; G.over = true; sfx.die();
  const earned = Math.floor((G.coins + Math.floor(G.t/30) + Math.floor(G.kills/20)) );
  const st = SAVE.stats; st.runs++; st.kills += G.kills; st.bestT = Math.max(st.bestT, G.t); st.bestL = Math.max(st.bestL, G.lvl);
  SAVE.coins += earned; persist();
  $('#oBody').innerHTML =
    `<div class="stat"><span>Tiempo</span><b>${fmtT(G.t)}</b></div><div class="stat"><span>Nivel</span><b>${G.lvl}</b></div>` +
    `<div class="stat"><span>Derrotados</span><b>${G.kills}</b></div><div class="stat"><span>Monedas ganadas</span><b class="coin">+${earned}</b></div>`;
  setTimeout(() => $('#ovOver').classList.add('on'), 700);
}

/* ---------- 7. DIBUJO ---------- */
function bgTile(x,y){ const h = (x*374761393 + y*668265263) >>> 0; return (h ^ (h>>>13)) * 1274126177 >>> 0; }
function draw(){
  const g = G; ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#243a2a'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(Z,0,0,Z,0,0); ctx.imageSmoothingEnabled = false;
  const vw = cv.width/Z, vh = cv.height/Z, cx = g.cam.x - vw/2, cy = g.cam.y - vh/2;
  ctx.translate(-Math.round(cx), -Math.round(cy));
  // suelo: baldosas con detalles deterministas
  const T = 48, x0 = Math.floor(cx/T), y0 = Math.floor(cy/T);
  for(let ty=y0; ty<=y0+vh/T+1; ty++) for(let tx=x0; tx<=x0+vw/T+1; tx++){
    const h = bgTile(tx,ty);
    ctx.fillStyle = ((tx+ty)&1) ? '#2a4331' : '#264030'; ctx.fillRect(tx*T,ty*T,T,T);
    if(h%7===0){ ctx.fillStyle='#35603f'; ctx.fillRect(tx*T+(h>>3)%36, ty*T+(h>>7)%36, 4, 4); }
    if(h%23===0){ ctx.fillStyle='#e8e0a0'; ctx.fillRect(tx*T+(h>>5)%36, ty*T+(h>>9)%36, 3, 3); }
  }
  // gemas
  for(const gm of g.gems){ if(gm.coin){ ctx.fillStyle='#ffd93b'; ctx.beginPath(); ctx.arc(gm.x,gm.y,5,0,7); ctx.fill(); ctx.fillStyle='#b8860b'; ctx.fillRect(gm.x-1,gm.y-3,2,6); }
    else { ctx.fillStyle = gm.v>=10?'#ff6ad5':'#5ad7ff'; ctx.save(); ctx.translate(gm.x,gm.y); ctx.rotate(Math.PI/4); ctx.fillRect(-3,-3,6,6); ctx.restore(); } }
  // enemigos
  for(const e of g.enemies){
    const s = makeSprite(e.seed, e.hue, false, e.boss?12:10, 3), sz = e.r*2.5;
    ctx.save(); ctx.translate(e.x,e.y); if(g.px<e.x) ctx.scale(-1,1);
    ctx.globalAlpha = 0.3; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(0,sz*0.45,sz*0.4,sz*0.14,0,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.drawImage(s,-sz/2,-sz/2,sz,sz);
    if(e.flash>0){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.7; ctx.drawImage(s,-sz/2,-sz/2,sz,sz); }
    ctx.restore();
    if(e.boss || e.hp<e.maxhp){ const w = e.boss?80:e.r*2; ctx.fillStyle='#000a'; ctx.fillRect(e.x-w/2,e.y-sz/2-8,w,4); ctx.fillStyle=e.boss?'#ff4d6d':'#e04'; ctx.fillRect(e.x-w/2,e.y-sz/2-8,w*Math.max(0,e.hp/e.maxhp),4); }
  }
  // orbes
  for(const m of flat()) if(m.id==='orbita' && m._orbs) for(const o of m._orbs){ ctx.fillStyle=TYPES.sombra.c; ctx.beginPath(); ctx.arc(o.x,o.y,8,0,7); ctx.fill(); ctx.fillStyle='#d9b8ff'; ctx.beginPath(); ctx.arc(o.x-2,o.y-2,3,0,7); ctx.fill(); }
  // jugador
  { const s = spriteOf(g.sp, g.shiny), sz = 34;
    if(!(g.inv>0 && Math.floor(g.t*20)%2)){
      ctx.save(); ctx.translate(g.px,g.py); ctx.scale(g.face,1);
      ctx.globalAlpha=0.3; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(0,15,13,5,0,0,7); ctx.fill(); ctx.globalAlpha=1;
      ctx.translate(0, Math.sin(g.t*10)*1.2); ctx.drawImage(s,-sz/2,-sz/2,sz,sz); ctx.restore(); } }
  // proyectiles
  for(const p of g.proj){ ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.fillStyle='#fff8'; ctx.beginPath(); ctx.arc(p.x-p.r*0.3,p.y-p.r*0.3,p.r*0.4,0,7); ctx.fill(); }
  for(const b of g.ebul){ ctx.fillStyle='#ff4d6d'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke(); }
  // efectos
  for(const f of g.fx){
    if(f.k==='ring'){ const k = 1-f.t/f.life; ctx.strokeStyle=f.col; ctx.globalAlpha=1-k; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(f.x,f.y,f.r+(f.max-f.r)*k,0,7); ctx.stroke(); ctx.globalAlpha=1; }
    if(f.k==='bolt'){ ctx.strokeStyle=f.col; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(f.x+rnd(-8,8),f.y-200); ctx.lineTo(f.x+rnd(-10,10),f.y-100); ctx.lineTo(f.x+rnd(-10,10),f.y-40); ctx.lineTo(f.x,f.y); ctx.stroke(); }
  }
  ctx.font = 'bold 12px ui-monospace,monospace'; ctx.textAlign='center';
  for(const x of g.txt){ ctx.globalAlpha=Math.min(1,x.t*3); ctx.fillStyle='#000'; ctx.fillText(x.s,x.x+1,x.y+1); ctx.fillStyle='#fff'; ctx.fillText(x.s,x.x,x.y); } ctx.globalAlpha=1;

  drawHUD();
}
function drawHUD(){
  const g = G, w = cv.width/Z, h = cv.height/Z, m = mult();
  ctx.setTransform(Z,0,0,Z,0,0);
  for(const f of g.fx) if(f.k==='flash'){ ctx.fillStyle=`rgba(255,40,60,${0.35*f.t/f.life})`; ctx.fillRect(0,0,w,h); }
  // vida
  ctx.fillStyle='#000a'; ctx.fillRect(10,10,160,14); ctx.fillStyle='#e8445a'; ctx.fillRect(10,10,160*Math.max(0,g.hp/g.maxhp),14);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(10.5,10.5,160,14);
  ctx.font='bold 11px ui-monospace,monospace'; ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText(`${Math.ceil(Math.max(0,g.hp))}/${g.maxhp}`,14,21);
  // XP
  ctx.fillStyle='#000a'; ctx.fillRect(0,h-10,w,10); ctx.fillStyle='#5ad7ff'; ctx.fillRect(0,h-10,w*g.xp/xpNeed(g.lvl),10);
  // tiempo y datos
  ctx.textAlign='center'; ctx.font='bold 22px ui-monospace,monospace'; ctx.fillStyle='#000'; ctx.fillText(fmtT(g.t),w/2+1,31); ctx.fillStyle='#fff'; ctx.fillText(fmtT(g.t),w/2,30);
  ctx.textAlign='right'; ctx.font='bold 13px ui-monospace,monospace'; ctx.fillStyle='#fff';
  ctx.fillText(`Nv ${g.lvl}`, w-10, 22); ctx.fillStyle='#ffd93b'; ctx.fillText(`● ${g.coins}`, w-10, 40); ctx.fillStyle='#ccc'; ctx.fillText(`☠ ${g.kills}`, w-10, 58);
  // huecos de movimientos
  g.moves.forEach((gr,i) => { const x = 10+i*50, y = h-66, t = TYPES[MOVES[gr.id].type];
    ctx.fillStyle = i===g.sel ? '#ffd93b' : '#000a'; ctx.fillRect(x-2,y-2,44,44); ctx.fillStyle=t.c; ctx.fillRect(x,y,40,40);
    ctx.fillStyle='#0006'; ctx.fillRect(x,y+26,40,14);
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.font='bold 11px ui-monospace,monospace'; ctx.fillText(String(i+1),x+3,y+11);
    ctx.textAlign='center'; ctx.fillText(gr.lvl>=5?'EVO':'Nv'+gr.lvl,x+20,y+37);
    if(gr.links.length){ ctx.fillStyle='#fff'; ctx.fillText('+'+gr.links.length,x+28,y+13); }
    ctx.font='bold 10px ui-monospace,monospace'; ctx.fillText(MOVES[gr.id].name.slice(0,7),x+20,y+23);
  });
  if(g.item){ const x = 10+4*50+8, y = h-66; ctx.fillStyle='#000a'; ctx.fillRect(x-2,y-2,84,44); ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.font='bold 11px ui-monospace,monospace'; ctx.fillText('Objeto',x+2,y+12); ctx.fillStyle='#ffd93b'; ctx.fillText(ITEMS[g.item].name,x+2,y+30); }
  if(g.banner){ ctx.textAlign='center'; ctx.font='bold 24px ui-monospace,monospace'; ctx.fillStyle='#000'; ctx.fillText(g.banner.s,w/2+1,91); ctx.fillStyle='#ff6a7d'; ctx.fillText(g.banner.s,w/2,90); }
  // joystick táctil
  if(touch){ ctx.strokeStyle='#fff6'; ctx.lineWidth=3; const sx = w/innerWidth, sy = h/innerHeight;
    ctx.beginPath(); ctx.arc(touch.ox*sx, touch.oy*sy, 36, 0, 7); ctx.stroke();
    ctx.fillStyle='#fff4'; ctx.beginPath(); ctx.arc(touch.ox*sx + clamp(touch.x-touch.ox,-36,36)*sx, touch.oy*sy + clamp(touch.y-touch.oy,-36,36)*sy, 14, 0, 7); ctx.fill(); }
}

const upCost = u => Math.round(u.base * Math.pow(SAVE.up[u.id]+1, 1.5));
function panelUpgrades(){
  let h = `<p class="sub">Monedas: <span class="coin">${SAVE.coins}</span></p>`;
  UPGRADES.forEach(u => { const lv = SAVE.up[u.id], max = lv>=MAX_UP;
    h += `<div class="stat"><span><b>${u.name}</b> Nv ${lv}/${MAX_UP}<br><small style="color:var(--mut)">${u.desc}</small></span>
          <button data-u="${u.id}" ${max||SAVE.coins<upCost(u)?'disabled':''}>${max?'MAX':'● '+upCost(u)}</button></div>`; });
  openPanel('Mejoras', h);
  $('#pBody').querySelectorAll('button[data-u]').forEach(b => b.onclick = () => {
    const u = UPGRADES.find(x => x.id===b.dataset.u), c = upCost(u);
    if(SAVE.coins>=c && SAVE.up[u.id]<MAX_UP){ SAVE.coins -= c; SAVE.up[u.id]++; persist(); refreshMenu(); panelUpgrades(); beep(660,0.1,'triangle',0.05); } });
}
function gachaRoll(){
  const sp = pick(SPECIES), o = SAVE.owned[sp.id];
  if(!o){ SAVE.owned[sp.id] = {shiny: Math.random()<0.05}; return `¡Nuevo compañero: <b>${sp.name}</b>${SAVE.owned[sp.id].shiny?' ✨ shiny':''}!`; }
  if(!o.shiny && Math.random()<0.10){ o.shiny = true; return `¡<b>${sp.name}</b> shiny! ✨`; }
  SAVE.coins += 40; return `${sp.name} repetido → +40 monedas`;
}
function panelGacha(msg=[]){
  openPanel('Gacha', `<p class="sub">Monedas: <span class="coin">${SAVE.coins}</span> · Compañeros nuevos y versiones shiny</p>
    <div class="menu"><button id="g1" ${SAVE.coins<100?'disabled':''}>Tirar ×1 · ● 100</button><button id="g10" ${SAVE.coins<900?'disabled':''}>Tirar ×10 · ● 900</button></div>
    <div style="margin-top:14px">${msg.map(m => `<div class="stat"><span>${m}</span></div>`).join('')}</div>`);
  const go = (n, cost) => () => { if(SAVE.coins<cost) return; SAVE.coins -= cost; const r=[]; for(let i=0;i<n;i++) r.push(gachaRoll()); persist(); refreshMenu(); sfx.lvl(); panelGacha(r); };
  $('#g1').onclick = go(1,100); $('#g10').onclick = go(10,900);
}
function panelStats(){
  const s = SAVE.stats;
  openPanel('Estadísticas', [['Runs',s.runs],['Mejor tiempo',fmtT(s.bestT)],['Mejor nivel',s.bestL],['Enemigos derrotados',s.kills],
    ['Compañeros',Object.keys(SAVE.owned).length+' / '+SPECIES.length],['Shinies',Object.values(SAVE.owned).filter(o=>o.shiny).length]]
    .map(([a,b]) => `<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('') +
    '<div class="center" style="margin-top:14px"><button id="bReset">Borrar toda la partida</button></div>');
  $('#bReset').onclick = () => { if(confirm('¿Borrar todo el progreso?')){ SAVE = defaultSave(); persist(); refreshMenu(); hide('#ovPanel'); } };
}
function panelGuide(){
  openPanel('Guía', `<div class="stat"><span>Moverse</span><b>WASD / flechas / arrastrar el dedo</b></div>
    <div class="stat"><span>Atacar</span><b>Automático</b></div>
    <div class="stat"><span>Movimiento principal</span><b>1–4 · Q/E (+25% daño)</b></div>
    <div class="stat"><span>Pausa</span><b>Esc</b></div>
    <p class="hint" style="text-align:left;font-size:14px">Recoge gemas azules para subir de nivel y elige mejoras. Al nivel 5 de un movimiento evoluciona.
    Niveles 5, 15, 25…: objeto (sólo uno). Niveles 10, 20, 30…: Vínculo, que une dos movimientos en un hueco.
    Cada 4 minutos aparece un legendario. Las monedas sirven para mejoras permanentes y el Gacha.</p>`);
}
function setSound(v){ SAVE.sound = v; persist(); $('#bSound').textContent = 'Sonido: ' + (v?'sí':'no'); $('#bSnd2').textContent = 'Sonido: ' + (v?'sí':'no'); }

$('#bPlay').onclick = () => { newRun(); beep(600,0.1,'square',0.04); };
$('#bAgain').onclick = () => newRun();
$('#bMenu').onclick = () => { G = null; hide('#ovOver'); show('#ovMenu'); refreshMenu(); };
$('#bComp').onclick = panelCompanions; $('#bUp').onclick = panelUpgrades; $('#bGacha').onclick = () => panelGacha();
$('#bStats').onclick = panelStats; $('#bGuide').onclick = panelGuide;
$('#pBack').onclick = () => hide('#ovPanel');
$('#bSound').onclick = $('#bSnd2').onclick = () => setSound(!SAVE.sound);
$('#bResume').onclick = () => togglePause(false);
$('#bQuit').onclick = () => { hide('#ovPause'); G.paused=false; G.hp = 0; endRun(); };
$('#lReroll').onclick = () => { if(G.rerolls>0 && curOffer.kind==='normal'){ G.rerolls--; openLevelUp(offerOptions(G.pending[0])); } };
$('#lSkip').onclick = closeLevelUp;

function togglePause(v){
  if(!G || G.over || $('#ovLvl').classList.contains('on')) return;
  G.paused = v===undefined ? !G.paused : v;
  $('#ovPause').classList.toggle('on', G.paused);
}

/* ---------- Entrada ---------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(!G) return;
  if($('#ovLvl').classList.contains('on')){
    if(['1','2','3'].includes(k) && curOffer.opts[+k-1]) chooseOffer(curOffer.opts[+k-1]);
    if(k==='r') $('#lReroll').click();
    return;
  }
  if(k==='escape') togglePause();
  if(G.paused) return;
  if(['1','2','3','4'].includes(k) && G.moves[+k-1]) G.sel = +k-1;
  if(k==='q') G.sel = (G.sel-1+G.moves.length)%G.moves.length;
  if(k==='e') G.sel = (G.sel+1)%G.moves.length;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k]=false; if(G && !G.over) togglePause(true); });
cv.addEventListener('pointerdown', e => { if(e.pointerType==='touch' || e.pointerType==='pen'){ touch = {ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); } });
cv.addEventListener('pointermove', e => { if(touch){ touch.x=e.clientX; touch.y=e.clientY; } });
const endTouch = () => { touch = null; };
cv.addEventListener('pointerup', endTouch); cv.addEventListener('pointercancel', endTouch);

/* ---------- 9. BUCLE PRINCIPAL ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if(G){ if(!G.paused && !G.over) update(dt); draw(); }
  else { ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#1b1528'; ctx.fillRect(0,0,cv.width,cv.height); }
  requestAnimationFrame(frame);
}
refreshMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
