<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Criaturas Survivor</title>
<style>
  :root{--bg:#1b1528;--panel:#2a2040;--panel2:#3a2d59;--txt:#f4efff;--mut:#a99bc9;--acc:#ffd93b;--bad:#ff5d6c;--ok:#5fcf6a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,10,28,.82);padding:16px;overflow:auto}
  .ov.on{display:flex}
  .box{background:var(--panel);border:3px solid var(--panel2);border-radius:10px;padding:18px 20px;max-width:760px;width:100%;max-height:100%;overflow:auto}
  h1{margin:0 0 4px;font-size:34px;color:var(--acc);text-align:center;letter-spacing:1px}
  h2{margin:0 0 10px;font-size:22px;color:var(--acc)}
  .sub{color:var(--mut);text-align:center;margin:0 0 14px;font-size:14px}
  button{font:inherit;color:var(--txt);background:var(--panel2);border:2px solid #52408a;border-radius:8px;padding:9px 14px;cursor:pointer}
  button:hover:not(:disabled){background:#4b3a7a;border-color:var(--acc)}
  button:disabled{opacity:.45;cursor:default}
  button.big{font-size:22px;padding:12px 28px;background:#4f9d3b;border-color:#7be061}
  button.big:hover{background:#5fb94a}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .card{text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
  .card b{color:var(--acc)} .card small{color:var(--mut)} .card .k{color:var(--mut);font-size:12px}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;color:#111;margin-right:4px}
  .center{text-align:center}
  .companion{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0}
  .companion canvas{position:static;width:96px;height:96px;image-rendering:pixelated}
  .stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--panel2);padding:5px 0}
  .coin{color:var(--acc)}
  .locked{filter:grayscale(1) brightness(.5)}
  .sil{filter:brightness(0);opacity:.55}
  .dcard{background:var(--panel2);border:2px solid #52408a;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-size:13px}
  .dcard small{color:var(--mut)} .dcard b{color:var(--acc)}
  .sel{border-color:var(--acc)!important}
  .hint{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- MENÚ PRINCIPAL -->
<div class="ov on" id="ovMenu"><div class="box">
  <h1>Criaturas Survivor</h1>
  <p class="sub">Sobrevive a las hordas con tu compañero · clon local de aprendizaje</p>
  <div class="companion"><canvas id="menuSprite" width="30" height="30"></canvas><div id="menuName"></div></div>
  <div class="center"><button class="big" id="bPlay">Jugar</button></div>
  <div class="menu">
    <button id="bComp">Compañeros</button>
    <button id="bUp">Mejoras</button>
    <button id="bGacha">Gacha</button>
    <button id="bStats">Estadísticas</button>
    <button id="bDex">Criaturario</button>
    <button id="bGuide">Guía</button>
    <button id="bSound">Sonido: sí</button>
  </div>
  <p class="hint">Monedas: <span class="coin" id="mCoins">0</span> · Los datos se guardan en este navegador</p>
</div></div>

<!-- PANEL GENÉRICO -->
<div class="ov" id="ovPanel"><div class="box">
  <div class="row"><h2 id="pTitle"></h2><button id="pBack">Volver</button></div>
  <div id="pBody"></div>
</div></div>

<!-- SUBIDA DE NIVEL -->
<div class="ov" id="ovLvl"><div class="box">
  <h2 id="lTitle"></h2>
  <p class="sub" id="lSub"></p>
  <div class="grid" id="lCards"></div>
  <div class="row" style="margin-top:12px"><button id="lReroll">Cambiar opciones (R)</button><button id="lSkip" style="display:none">No, gracias</button></div>
</div></div>

<!-- PAUSA -->
<div class="ov" id="ovPause"><div class="box center">
  <h2>Pausa</h2>
  <p class="sub">WASD / flechas: moverse · 1–4: movimiento principal · Q/E: ciclar · Esc: pausa</p>
  <div class="menu"><button id="bResume">Continuar</button><button id="bSnd2">Sonido</button><button id="bQuit">Abandonar run</button></div>
</div></div>

<!-- FIN DE PARTIDA -->
<div class="ov" id="ovOver"><div class="box center">
  <h2 id="oTitle">Has caído…</h2>
  <div id="oBody"></div>
  <div class="menu"><button id="bAgain" class="big">Otra vez</button><button id="bMenu">Volver al menú</button></div>
</div></div>

<script>
"use strict";
/* ============================================================
   CRIATURAS SURVIVOR — un solo archivo, sin dependencias.
   Secciones: 1 datos · 2 guardado · 3 sprites · 4 audio ·
   5 estado de la run · 6 lógica · 7 dibujo · 8 menús · 9 arranque
   ============================================================ */

const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtT = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');

/* ---------- 1. DATOS ---------- */
const TYPES = {
  fuego:{n:'Fuego',c:'#ff7a3d',h:18}, agua:{n:'Agua',c:'#4aa8ff',h:205}, planta:{n:'Planta',c:'#5fcf6a',h:120},
  electrico:{n:'Eléctrico',c:'#ffd93b',h:50}, sombra:{n:'Sombra',c:'#8a5cc2',h:270}, dragon:{n:'Dragón',c:'#4f6bff',h:230}
};
// Criaturas originales (nada de Nintendo): cada una se dibuja por código a partir de la semilla.
const SPECIES = [

  {id:'gotin',    name:'Gotín',    type:'agua',      hp:110, spd:140, move:'pistola',  seed:23, free:true},
  {id:'brotin',   name:'Brotín',   type:'planta',    hp:120, spd:135, move:'latigo',   seed:37, free:true},
  {id:'chispin',  name:'Chispín',  type:'electrico', hp:85,  spd:170, move:'trueno',   seed:41, free:false},
  {id:'sombrio',  name:'Sombrío',  type:'sombra',    hp:95,  spd:155, move:'orbita',   seed:59, free:false},

const MOVES = {

  pistola:{name:'Pistola Agua',evo:'Hidrobomba',     type:'agua',      cd:1.10, dmg:14, desc:'Chorro que atraviesa enemigos'},

  zarpazo:{name:'Zarpazo',     evo:'Zarpazo Umbrío', type:'sombra',    cd:0.90, dmg:13, desc:'Tajo en abanico hacia delante'},
  cometa: {name:'Cometa',      evo:'Meteoro',        type:'fuego',     cd:2.00, dmg:11, desc:'Bola lenta y enorme que atraviesa todo'},
  // Control: poco daño, pero cada tipo aplica su propio estado a los enemigos

// Ventajas y debilidades: cada tipo es fuerte contra uno (×EFF_UP) y débil contra otro (×EFF_DOWN). Dos triángulos:
// Fuego > Planta > Agua > Fuego  y  Eléctrico > Dragón > Sombra > Eléctrico. Vale para tus ataques y para los de los hostiles.
const EFF_UP = 1.3, EFF_DOWN = 0.75;
const STRONG = {fuego:'planta', planta:'agua', agua:'fuego', electrico:'dragon', dragon:'sombra', sombra:'electrico'};
const eff = (a, d) => (!a || !d) ? 1 : STRONG[a]===d ? EFF_UP : STRONG[d]===a ? EFF_DOWN : 1;
const weakTo = t => Object.keys(STRONG).find(k => STRONG[k]===t);
const chartTxt = t => `Fuerte vs ${TYPES[STRONG[t]].n} · Débil vs ${TYPES[weakTo(t)].n}`;
const STATUS_COL = [['slow','#4aa8ff'],['root','#5fcf6a'],['stun','#ffd93b'],['burn','#ff7a3d'],['shrink','#8a5cc2']];
// Pasivas: mejoran siempre sin disparar nada. Cada una pertenece a una rama y las ramas se excluyen por parejas:
// al coger la primera pasiva de una rama, su rama opuesta queda bloqueada el resto de la partida (y nunca sale en las ofertas).
const BRANCHES = {
  agilidad: {n:'Agilidad', c:'#4de3b0', opp:'fortaleza'}, fortaleza:{n:'Fortaleza', c:'#e8a14a', opp:'agilidad'},
  poder:    {n:'Poder',    c:'#ff5f6d', opp:'ingenio'},   ingenio:  {n:'Ingenio',   c:'#6ec6ff', opp:'poder'},
};
const PASSIVES = {
  pies:    {branch:'agilidad', name:'Pies Ligeros',   desc:'+7% velocidad por nivel'},
  esquiva: {branch:'agilidad', name:'Esquiva',        desc:'+5% de esquivar un golpe por nivel'},
  reflejos:{branch:'agilidad', name:'Reflejos',       desc:'+0,12 s de invulnerabilidad tras un golpe por nivel'},
  piel:    {branch:'fortaleza',name:'Piel Dura',      desc:'-6% de daño recibido por nivel'},
  regen:   {branch:'fortaleza',name:'Regeneración',   desc:'+0,5 de vida por segundo por nivel'},
  vigor:   {branch:'fortaleza',name:'Vigor',          desc:'+8% de vida máxima por nivel'},
  garra:   {branch:'poder',    name:'Garra Afilada',  desc:'+8% de daño por nivel'},
  critico: {branch:'poder',    name:'Golpe Crítico',  desc:'+6% de probabilidad de crítico (×2) por nivel'},
  ritmo:   {branch:'poder',    name:'Concentración',  desc:'-6% de tiempo de recarga por nivel'},
  sabio:   {branch:'ingenio',  name:'Sabiduría',      desc:'+8% de experiencia por nivel'},
  codicia: {branch:'ingenio',  name:'Codicia',        desc:'+15% de monedas por nivel'},
  olfato:  {branch:'ingenio',  name:'Olfato',         desc:'+15% de radio de recogida por nivel'},
};
const PAS_MAX = 5, PAS_SLOTS = 4;
const ITEMS = {
  iman:   {name:'Imán',          desc:'Recoges desde mucho más lejos'},
  bayas:  {name:'Bayas',         desc:'Regeneras vida poco a poco'},
  foco:   {name:'Banda Foco',    desc:'+20% de daño'},
  cinta:  {name:'Cinta Veloz',   desc:'Ataques 18% más rápidos'},
  coraza: {name:'Coraza',        desc:'Recibes 20% menos de daño'},
};
const ENEMY_TYPES = [
  {id:'hojarrata',   name:'Hojarrata',   type:'planta',    hp:18, spd:55, dmg:6,  r:10, hue:120, seed:3,  xp:1, from:0},
  {id:'chispamurci', name:'Chispamurci', type:'electrico', hp:14, spd:95, dmg:5,  r:9,  hue:50,  seed:8,  xp:1, from:60},
  {id:'aguamedusa',  name:'Aguamedusa',  type:'agua',      hp:30, spd:70, dmg:7,  r:11, hue:205, seed:27, xp:2, from:120},
  {id:'magmaroca',   name:'Magmaroca',   type:'fuego',     hp:90, spd:38, dmg:12, r:16, hue:18,  seed:15, xp:3, from:150},
  {id:'umbrabrujo',  name:'Umbrabrujo',  type:'sombra',    hp:40, spd:60, dmg:8,  r:12, hue:270, seed:21, xp:2, from:240, shoots:true},
  {id:'dracoaleta',  name:'Dracoaleta',  type:'dragon',    hp:60, spd:85, dmg:10, r:13, hue:230, seed:33, xp:3, from:360},
];
const UPGRADES = [
  {id:'hp',  name:'Vitalidad', desc:'+10% vida máxima por nivel',  base:60},
  {id:'dmg', name:'Fuerza',    desc:'+6% daño por nivel',          base:80},
  {id:'spd', name:'Agilidad',  desc:'+3% velocidad por nivel',     base:50},
  {id:'mag', name:'Atracción', desc:'+12% radio de recogida',      base:40},
  {id:'coin',name:'Fortuna',   desc:'+10% monedas por nivel',      base:70},
];
const MAX_UP = 10;

// Mapas: cada uno favorece a un tipo. Durante ese mapa, las criaturas de ese tipo (hostiles o tu compañero)
// reciben MAP_BUFF en SU especialidad (TYPE_BUFF.stat). Todo ajustable desde estas tablas.
const MAP_BUFF = 1.2, MAP_EVERY = 75;
const TYPE_BUFF = {
  fuego:    {stat:'dmg',  label:'Daño'},
  agua:     {stat:'res',  label:'Resistencia'},
  planta:   {stat:'hp',   label:'Vitalidad'},
  electrico:{stat:'spd',  label:'Velocidad'},
  sombra:   {stat:'rate', label:'Cadencia'},
  dragon:   {stat:'size', label:'Tamaño y alcance'},
};
const MAPS = [
  {id:'crater',   name:'Cráter Ardiente',     type:'fuego',     a:'#3d2622', b:'#38211e', d1:'#5e3326', d2:'#ff9a4a'},
  {id:'lago',     name:'Lago Sereno',         type:'agua',      a:'#20384f', b:'#1c3249', d1:'#2f5878', d2:'#bfe6ff'},
  {id:'bosque',   name:'Bosque Profundo',     type:'planta',    a:'#2a4331', b:'#264030', d1:'#35603f', d2:'#e8e0a0'},
  {id:'llanura',  name:'Llanura Tormentosa',  type:'electrico', a:'#3d3b24', b:'#383620', d1:'#5c5830', d2:'#fff27a'},
  {id:'ruinas',   name:'Ruinas Umbrías',      type:'sombra',    a:'#2c2342', b:'#271f3b', d1:'#44345f', d2:'#c9a8ff'},
  {id:'cumbre',   name:'Cumbre Dracónica',    type:'dragon',    a:'#26304f', b:'#222b47', d1:'#37457a', d2:'#9fb4ff'},
];
// Obstáculos: el mundo es infinito y se genera por trozos con una semilla (ver «Mundo»). Cada obstáculo guarda sólo su clase;
// su aspecto, su nombre y el efecto del líquido salen del tipo del mapa actual, así que todo cambia al cambiar de mapa.
// Clases: montaña (sólida, indestructible), árbol (sólido, indestructible), piedra (sólida, destructible),
// hierba (se atraviesa, destructible, reduce la visión) y líquido (se atraviesa: daña o ralentiza, salvo a las criaturas del tipo del mapa).
// Colores: mont=[sombra, cuerpo, cima], arbol=[tronco, copa], piedra=[base, brillo], hierba=[tono 1, tono 2], liq=[base, brillo].
const BIOME = {
  fuego:    {n:{mont:'Volcán',          arbol:'Árbol calcinado', piedra:'Roca ígnea',     hierba:'Maleza seca',    liq:'Lava'},
             mont:['#2b1a18','#5a2e26','#ff6a2a'], arbol:['#2a1d18','#6a4a38'], shape:'dead', piedra:['#5a4a46','#8a6a5a'], hierba:['#7a5a2a','#a07a38'], liq:['#d83a10','#ffb347'], eff:{dps:7}},
  agua:     {n:{mont:'Iceberg',         arbol:'Palmera',         piedra:'Roca marina',    hierba:'Algas altas',    liq:'Aguas profundas'},
             mont:['#4a88a8','#8fcbe3','#ffffff'], arbol:['#7a5a3a','#2f9e6a'], shape:'palm', piedra:['#6a8aa0','#9ab8c8'], hierba:['#1f7a6a','#38b09a'], liq:['#1d5fb0','#6ec6ff'], eff:{slow:0.6}},
  planta:   {n:{mont:'Colina rocosa',   arbol:'Roble',           piedra:'Piedra musgosa', hierba:'Hierba alta',    liq:'Pantano'},
             mont:['#4a5a44','#7f927a','#a8c59a'], arbol:['#5a3a22','#2f8f3a'], shape:'round', piedra:['#7a8070','#a0a890'], hierba:['#2a7a2a','#3fae3f'], liq:['#4a5a2a','#8a9a4a'], eff:{slow:0.65}},
  electrico:{n:{mont:'Pico de cuarzo',  arbol:'Pararrayos',      piedra:'Cristal',        hierba:'Matorral estático',liq:'Charco cargado'},
             mont:['#6a5a20','#a89030','#ffe97a'], arbol:['#666666','#ffd93b'], shape:'pole', piedra:['#7a7040','#d8c860'], hierba:['#8a8a30','#c8c840'], liq:['#3a3a90','#ffe97a'], eff:{dps:5}},
  sombra:   {n:{mont:'Risco sombrío',   arbol:'Árbol retorcido', piedra:'Piedra negra',   hierba:'Zarzas oscuras', liq:'Brea'},
             mont:['#1c1630','#3f3066','#7a5cc2'], arbol:['#1e1830','#4a3070'], shape:'dead', piedra:['#2c2c40','#4a4a68'], hierba:['#2a1a40','#46286a'], liq:['#14101c','#5a3a8a'], eff:{slow:0.5}},
  dragon:   {n:{mont:'Cumbre nevada',   arbol:'Pino azul',       piedra:'Roca azul',      hierba:'Nubes bajas',    liq:'Ácido'},
             mont:['#2a3a7a','#5f78d0','#e0e8ff'], arbol:['#3a3a5a','#4f6bff'], shape:'pine', piedra:['#4a5a9a','#7a90e0'], hierba:['#3a4aa0','#6a80e8'], liq:['#3a6a2a','#a0e040'], eff:{dps:6}},
};
const OBS_HP = {piedra:45, hierba:10};
// Legendarios: uno por tipo; el jefe que aparece cada 4 minutos es de un tipo al azar.
const LEG = {
  fuego:    {name:'Solarax',   seed:101}, agua:   {name:'Abisomar', seed:102}, planta: {name:'Gaiarbol', seed:103},
  electrico:{name:'Voltarion', seed:104}, sombra: {name:'Noctirex', seed:105}, dragon: {name:'Draconix', seed:106},
};
// Criaturario: textos propios (nada copiado de ningún juego).
const DESC = {
  brasito:'Una brasa con patas que nunca se apaga. Calienta a sus amigos y chamusca al resto.',
  gotin:'Una gota curiosa que rebota por los charcos. Su chorro atraviesa lo que se ponga delante.',
  brotin:'Hojas, raíces y mucha paciencia. Su látigo barre a todo el que se acerque demasiado.',
  chispin:'Pequeño y nervioso, acumula electricidad en las orejas y la suelta en el momento justo.',
  sombrio:'Nadie sabe de dónde viene. Las esferas que lo rodean parecen vigilar en todas direcciones.',

  aguamedusa:'Medusa flotante de aguas dulces. Su roce adormece los reflejos.',
  magmaroca:'Un bloque de roca fundida que avanza despacio pero aguanta muchísimo.',
  umbrabrujo:'Hechicero de las ruinas. Lanza bolas de sombra desde la distancia.',
  dracoaleta:'Joven de las cumbres. Rápida, resistente y con mal carácter.',
  'leg-fuego':'Leyenda de los cráteres: dicen que su sola presencia hace hervir el suelo.',
  'leg-agua':'Habita en lo más hondo del lago. Cuando sube a la superficie llega la marea.',
  'leg-planta':'Un árbol que camina. Los bosques crecen allí donde descansa.',
  'leg-electrico':'Cabalga las tormentas. Cada paso suyo es un trueno.',
  'leg-sombra':'Habita las ruinas olvidadas. Su silueta se come la luz a su alrededor.',
  'leg-dragon':'Señor de las cumbres. Su rugido se oye en tres montañas.',
};
const DEX = [
  ...SPECIES.map(x => ({id:x.id, name:x.name, type:x.type, role:'Compañero', seed:x.seed, hp:x.hp, spd:x.spd, note:'Empieza con '+MOVES[x.move].name})),
  ...ENEMY_TYPES.map(x => ({id:x.id, name:x.name, type:x.type, role:'Hostil', seed:x.seed, hue:x.hue, hp:x.hp, spd:x.spd, note:'Aparece desde '+Math.floor(x.from/60)+' min'})),

/* ---------- 3. SPRITES PROCEDURALES ---------- */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const spriteCache = {};
// Cuadrícula 10x10 simétrica: se rellena media figura al azar y se refleja.
function makeSprite(seed, hue, shiny, N=10, px=3){
  const key = [seed,hue,shiny,N,px].join('|');
  if(spriteCache[key]) return spriteCache[key];
  const R = mulberry(seed*977+13), h = shiny ? (hue+150)%360 : hue;
  const half = N/2, g = Array.from({length:N}, () => Array(N).fill(0));
  for(let y=1;y<N-1;y++) for(let x=0;x<half;x++){
    const cx = (x+0.5)/half, cy = Math.abs((y-N/2+0.5)/(N/2));
    const p = 0.9*cx - 0.55*cy + (R()-0.5)*0.9;
    if(p > 0.18 || (x>=half-1 && y>2 && y<N-2)) g[y][x] = 1;
  }
  for(let y=0;y<N;y++) for(let x=0;x<half;x++) g[y][N-1-x] = g[y][x];
  const c = document.createElement('canvas'); c.width = c.height = N*px;
  const k = c.getContext('2d');
  const body = `hsl(${h},70%,58%)`, shade = `hsl(${h},70%,42%)`, line = `hsl(${h},50%,14%)`;
  const at = (x,y) => x>=0&&y>=0&&x<N&&y<N&&g[y][x];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if(g[y][x]){ k.fillStyle = (y>N*0.62) ? shade : body; k.fillRect(x*px,y*px,px,px); }
    else if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){ k.fillStyle=line; k.fillRect(x*px,y*px,px,px); }
  }
  const ey = Math.floor(N*0.4);   // ojos
  for(const ex of [half-2, half+1]){
    k.fillStyle='#fff'; k.fillRect(ex*px,ey*px,px,px);
    k.fillStyle='#111'; k.fillRect(ex*px+px/2,ey*px+px/2,px/2,px/2);
  }
  return spriteCache[key] = c;
}
const spriteOf = (sp, shiny) => makeSprite(sp.seed, TYPES[sp.type].h, shiny);

let AC = null;
function beep(f, d=0.08, type='square', vol=0.04, slide=0){
  if(!SAVE.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), t+d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}

// Buff del mapa: MAP_BUFF si el tipo coincide con el del mapa Y la estadística es la especialidad de ese tipo.
function buffFor(type, stat){ return (G && G.map && G.map.type===type && TYPE_BUFF[type].stat===stat) ? MAP_BUFF : 1; }
const pb = stat => buffFor(G.sp.type, stat);          // buff de tu compañero
const eb = (e, stat) => buffFor(e.type, stat);        // buff de un hostil
function syncEnemy(e){                                // vida y tamaño se aplican al cambiar de mapa (y se revierten)
  const th = eb(e,'hp'), tr = eb(e,'size');
  if(e.hpBuf !== th){ const r = th/e.hpBuf; e.hp *= r; e.maxhp *= r; e.hpBuf = th; }
  if(e.rBuf !== tr){ e.r *= tr/e.rBuf; e.rBuf = tr; }
}
function recalcMax(ratio){                              // vida máxima = base × Vigor × buff del mapa; mantiene la proporción de vida
  if(ratio === undefined) ratio = G.maxhp > 0 ? G.hp/G.maxhp : 1;
  G.maxhp = Math.round(G.baseMax * (1+0.08*pl('vigor')) * pb('hp')); G.hp = G.maxhp*ratio;
}

  const ratio = G.maxhp > 0 ? G.hp/G.maxhp : 1;       // la vida máxima de la criatura de ese tipo sube/baja con el mapa
  recalcMax(ratio);
  for(const e of G.enemies) syncEnemy(e);
  if(!SAVE.dex.m[m.id]){ SAVE.dex.m[m.id] = true; G.newDisc.push(m.name); persist(); }
  if(!first){
    const t = TYPES[m.type];

    G.fx.push({k:'mapflash', life:0.8, t:0.8, col:t.c}); beep(330,0.2,'triangle',0.05,220);

}

/* ---------- Mundo: obstáculos por trozos ---------- */
const CH = 480;                                            // lado de un trozo del mundo (px)
const hash2 = (a, b, s) => { let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(s, 1274126177)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; };
function mulberry(a){ return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// Un trozo siempre sale igual con la misma semilla. Los centros quedan a >=75 px del borde, así que entre trozos vecinos
// siempre queda hueco para pasar; dentro del trozo, los sólidos se separan >=28 px. La zona de inicio queda despejada.
function getChunk(cx, cy){
  const key = cx + ',' + cy; let c = G.chunks.get(key); if(c) return c;
  const r = mulberry(hash2(cx, cy, G.seed)), out = [], x0 = cx*CH, y0 = cy*CH, M = 75; let idx = 0;
  const place = (k, n, rmin, rmax, solid) => { for(let i=0;i<n;i++){
    const rad = rmin + r()*(rmax-rmin), x = x0 + M + r()*(CH-2*M), y = y0 + M + r()*(CH-2*M), v = r(), id = key + ':' + (idx++);
    if(Math.hypot(x, y) < 170 + rad || G.broken.has(id)) continue;
    if(solid && out.some(o => o.solid && Math.hypot(o.x-x, o.y-y) < o.r + rad + 28)) continue;
    out.push({k, x, y, r:rad, v, solid, id, hp:OBS_HP[k]||0, flash:0, orbT:0, dead:false}); } };
  place('montana', r() < 0.5 ? 1 : 0, 40, 58, true);
  place('arbol',   2 + Math.floor(r()*3), 13, 13, true);
  place('piedra',  1 + Math.floor(r()*3), 12, 16, true);
  place('hierba',  1 + Math.floor(r()*3), 28, 50, false);
  place('liquido', r() < 0.5 ? 1 : 0, 55, 100, false);
  G.chunks.set(key, out); return out;
}
function refreshNear(){                                      // objetos de los 5x5 trozos alrededor del jugador
  const pcx = Math.floor(G.px/CH), pcy = Math.floor(G.py/CH), n = {solid:[], dest:[], liq:[], grass:[]};
  for(let j=-2;j<=2;j++) for(let i=-2;i<=2;i++) for(const o of getChunk(pcx+i, pcy+j)){ if(o.dead) continue;
    if(o.solid) n.solid.push(o);
    if(o.k==='piedra') n.dest.push(o); else if(o.k==='hierba'){ n.dest.push(o); n.grass.push(o); } else if(o.k==='liquido') n.liq.push(o); }
  G.near = n;
  if(G.chunks.size > 80) for(const key of [...G.chunks.keys()]){ const [a, b] = key.split(',').map(Number); if(Math.abs(a-pcx) > 4 || Math.abs(b-pcy) > 4) G.chunks.delete(key); }
}
function hitObs(o, d){                                       // piedras y hierba se rompen; el resto no recibe daño
  if(o.dead || !OBS_HP[o.k]) return;
  o.hp -= d; o.flash = 0.12;
  if(o.hp <= 0){ o.dead = true; G.broken.add(o.id);
    G.fx.push({k:'ring', x:o.x, y:o.y, r:4, max:o.r+10, life:0.3, t:0.3, col:BIOME[G.map.type][o.k==='piedra'?'piedra':'hierba'][1]});

    if(o.k==='piedra' && Math.random() < 0.3) G.gems.push({x:o.x, y:o.y, v:0, coin:true, c:1}); }
}
function hitArea(x, y, R, d){ for(const o of G.near.dest) if(!o.dead && (o.x-x)**2 + (o.y-y)**2 < (R+o.r)**2) hitObs(o, d); }
function liqAt(x, y){ for(const o of G.near.liq){ const dx = (x-o.x)/o.r, dy = (y-o.y)/(o.r*0.65); if(dx*dx + dy*dy < 1) return o; } return null; }

      G.fx.push({k:'ring',x:G.px,y:G.py,r:10,max:R,life:0.3,t:0.3,col});
      hitArea(G.px,G.py,R,d);
      beep(700,0.08,'square',0.025,-300); break; }
    case 'niebla': {
      const R = (130 + 12*L + (evo?40:0)) * pb('size');
      for(const e of G.enemies) if((e.x-G.px)**2+(e.y-G.py)**2 < (R+e.r)**2){ hurt(e,d); status(e,'shrink',3+0.5*L+(evo?1.5:0)); }
      G.fx.push({k:'ring',x:G.px,y:G.py,r:12,max:R,life:0.6,t:0.6,col});
      hitArea(G.px,G.py,R,d);
      beep(140,0.2,'sine',0.03,-30); break; }
    case 'ciclon': {
      const near = G.enemies.filter(e => (e.x-G.px)**2+(e.y-G.py)**2 < 420*420); if(!near.length) return;
      let c = near[0], best = -1;                                       // el centro del tornado va al enemigo con más vecinos
      for(const a of near.slice(0,40)){ let n = 0; for(const b of near) if((a.x-b.x)**2+(a.y-b.y)**2 < 130*130) n++; if(n > best){ best = n; c = a; } }
      const R = (90 + 8*L + (evo?30:0)) * pb('size'), t = 2.2 + 0.3*L + (evo?1.5:0);
      G.tornados.push({x:c.x, y:c.y, R, t, life:t, d, tick:0});
      beep(120,0.25,'sawtooth',0.03,80); break; }
    // 'orbita' es continua: se resuelve en updateOrbs()
  }
}
function updateOrbs(dt){
  G.orbAng += dt*2.6;
  for(const m of flat()){ if(m.id!=='orbita') continue;
    const evo = m.lvl>=5, n = 2 + Math.floor(m.lvl/2) + (evo?1:0), R = (52 + 4*m.lvl) * pb('size');
    const d = moveDmg(m, G.moves[G.sel] && (G.moves[G.sel]===m || G.moves[G.sel].links.includes(m)));
    for(let i=0;i<n;i++){ const a = G.orbAng + i*Math.PI*2/n, ox = G.px+Math.cos(a)*R, oy = G.py+Math.sin(a)*R;
      m._orbs = m._orbs || []; m._orbs[i] = {x:ox,y:oy};
      for(const e of G.enemies){ if(e.orbT>0) continue;
        if((e.x-ox)**2+(e.y-oy)**2 < (e.r+8)**2){ hurt(e,d,MOVES[m.id].type); e.orbT = 0.35; const dd=Math.hypot(e.x-G.px,e.y-G.py)||1; e.kx+=(e.x-G.px)/dd*120; e.ky+=(e.y-G.py)/dd*120; } }
      for(const ob of G.near.dest){ if(ob.dead || ob.orbT>0) continue; if((ob.x-ox)**2+(ob.y-oy)**2 < (ob.r+8)**2){ hitObs(ob,d); ob.orbT = 0.35; } } }
    m._orbs.length = n; }
}

let curMT = null;                                  // tipo del movimiento en curso (para ventajas y debilidades)
function hurt(e, d, mt, quiet){
  if(mt === undefined) mt = curMT;
  const ef = eff(mt, e.type); d *= ef;
  const crit = pl('critico') > 0 && Math.random() < 0.06*pl('critico'); if(crit) d *= 2;
  e.hp -= d/eb(e,'res'); e.flash = 0.1;
  if(!quiet){ sfx.hit();
    if(G.txt.length<40) G.txt.push({x:e.x+rnd(-6,6),y:e.y-e.r,s:String(Math.round(d))+(crit?'!':'')+(ef>1?'↑':ef<1?'↓':''),t:0.5,c:ef>1?'#ffd93b':ef<1?'#9ab':null}); }
  if(e.hp<=0 && !e.dead) kill(e);
}
function dot(e, amt){ e.hp -= amt; if(e.hp<=0 && !e.dead) kill(e); }      // daño continuo (quemadura): sin sonido ni números
function status(e, k, t, v){                        // slow | root | stun | burn | shrink; los jefes resisten
  if(e.boss){ if(k==='root' || k==='stun') return; t *= 0.5; }
  e[k] = Math.max(e[k]||0, t); if(v !== undefined) e[k+'V'] = v;
}
function kill(e){
  e.dead = true; G.kills++; countKill(e);
  G.gems.push({x:e.x,y:e.y,v:e.boss?30:e.xp,coin:false});
  const m = mult();
  if(e.boss){ for(let i=0;i<8;i++) G.gems.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),v:0,coin:true,c:Math.ceil(5*m.coin)}); }
  else if(Math.random() < 0.07*m.coin) G.gems.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),v:0,coin:true,c:1});
}

function spawn(dt){
  const t = G.t;
  G.spawnAcc += dt * (1.4 + t/22);
  const cap = Math.min(80 + t*0.9, 320);
  while(G.spawnAcc >= 1){ G.spawnAcc -= 1; if(G.enemies.length >= cap) continue;
    const pool = ENEMY_TYPES.filter(e => t >= e.from);
    const w = pool.map((e,i) => i===pool.length-1 ? 1.2 : (i===0 ? 2 : 1.3));
    let r = Math.random()*w.reduce((a,b)=>a+b,0), et = pool[0];
    for(let i=0;i<pool.length;i++){ r -= w[i]; if(r<=0){ et = pool[i]; break; } }
    const a = rnd(0, Math.PI*2), dist = Math.max(W,H)/Z/2*1.1 + 40;
    const sc = 1 + t/110;
    G.enemies.push({...et, x:G.px+Math.cos(a)*dist, y:G.py+Math.sin(a)*dist, hp:et.hp*sc, maxhp:et.hp*sc, kx:0,ky:0, flash:0, orbT:0, shootT:rnd(1,3), ph:rnd(0,6.28), hpBuf:1, rBuf:1}); syncEnemy(G.enemies[G.enemies.length-1]);
  }
  if(t >= G.nextBoss){
    G.nextBoss += 240; G.bossN++; const bt = pick(Object.keys(TYPES));
    const a = rnd(0,Math.PI*2), dist = Math.max(W,H)/Z/2 + 80, hp = 900 + G.bossN*900 + t*2;
    G.enemies.push({id:'leg-'+bt,name:LEG[bt].name,type:bt,boss:true,hp,maxhp:hp,spd:42,dmg:20,r:34,hue:TYPES[bt].h,seed:LEG[bt].seed,xp:30,hpBuf:1,rBuf:1,x:G.px+Math.cos(a)*dist,y:G.py+Math.sin(a)*dist,kx:0,ky:0,flash:0,orbT:0,shootT:2,ph:0});
    syncEnemy(G.enemies[G.enemies.length-1]);
    G.banner = {s:'¡'+LEG[bt].name+' se acerca!', t:3}; sfx.boss();
  }
}

function playerHit(d, et){
  if(G.inv>0) return;
  if(pl('esquiva') > 0 && Math.random() < 0.05*pl('esquiva')){ G.inv = 0.3; if(G.txt.length<40) G.txt.push({x:G.px,y:G.py-20,s:'Esquiva',t:0.7}); return; }
  const ef = eff(et, G.sp.type);
  if(ef !== 1 && G.txt.length<40) G.txt.push({x:G.px,y:G.py-24,s:ef>1?'¡Débil!':'Resiste',t:0.7,c:ef>1?'#ff6a7d':'#9fe'});
  G.hp -= d*ef*mult().armor/pb('res'); G.inv = 0.6 + 0.12*pl('reflejos'); sfx.hurt();
  G.fx.push({k:'flash',life:0.15,t:0.15});
  if(G.hp<=0) endRun();
}

function addXP(v){
  G.xp += v * (1+0.08*pl('sabio'));
  while(G.xp >= xpNeed(G.lvl)){ G.xp -= xpNeed(G.lvl); G.lvl++; G.pending.push(G.lvl); G.hp = Math.min(G.maxhp, G.hp + G.maxhp*0.1); }
}
const xpNeed = l => 6 + l*5;

function update(dt){
  const g = G, m = mult();
  g.t += dt;
  g.mapT -= dt; if(g.mapT <= 0) changeMap();
  refreshNear(); const bio = BIOME[g.map.type]; for(const o of g.near.dest){ o.orbT -= dt; o.flash -= dt; }
  if(g.inv>0) g.inv -= dt;
  // movimiento
  let ix = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0), iy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
  if(touch){ const dx = touch.x-touch.ox, dy = touch.y-touch.oy, l = Math.hypot(dx,dy); if(l>8){ ix = dx/Math.max(l,40); iy = dy/Math.max(l,40); } }
  const il = Math.hypot(ix,iy); if(il>1){ ix/=il; iy/=il; }
  const lq = liqAt(g.px, g.py); g.liq = (lq && g.sp.type !== g.map.type) ? bio : null;      // los de su propio tipo son inmunes
  const spd = g.sp.spd * m.spd * pb('spd') * ((g.liq && g.liq.eff.slow) || 1);
  if(g.liq && g.liq.eff.dps){ g.hp -= g.liq.eff.dps*dt*m.armor/pb('res'); if(g.hp<=0){ endRun(); return; } }
  g.px += ix*spd*dt; g.py += iy*spd*dt; if(ix) g.face = ix>0?1:-1;
  for(let pass=0; pass<2; pass++) for(const o of g.near.solid){                       // los sólidos te empujan fuera
    const dx = g.px-o.x, dy = g.py-o.y, d = Math.hypot(dx,dy), mm = o.r+10;
    if(d < mm){ if(d === 0){ g.px += mm; continue; } g.px = o.x + dx/d*mm; g.py = o.y + dy/d*mm; } }
  g.inGrass = g.near.grass.some(o => (o.x-g.px)**2 + (o.y-g.py)**2 < (o.r*0.9)**2);
  g.vis += ((g.inGrass ? 1 : 0) - g.vis) * Math.min(1, dt*5);
  if(g.item==='bayas') g.hp = Math.min(g.maxhp, g.hp + 1.5*dt);
  if(pl('regen')) g.hp = Math.min(g.maxhp, g.hp + 0.5*pl('regen')*dt);
  // ataques
  g.moves.forEach((gr, i) => { gr.t -= dt;
    if(gr.t <= 0){ const focus = (i===g.sel); fire(gr, focus); for(const l of gr.links) fire(l, focus);
      gr.t = MOVES[gr.id].cd * m.cd / pb('rate'); } });
  updateOrbs(dt);
  spawn(dt);
  // enemigos
  for(const e of g.enemies){
    const dx = g.px-e.x, dy = g.py-e.y, dist = Math.hypot(dx,dy)||1;
    if(!e.disc && dist < 400){ e.disc = true; discover(e.id, e.name); }
    e.ph += dt*3; e.flash -= dt; e.orbT -= dt;
    const wob = Math.sin(e.ph)*0.25;
    for(const [k] of STATUS_COL) if(e[k] > 0) e[k] -= dt;
    if(e.burn > 0) dot(e, e.burnV*dt);
    const sm = (e.stun>0 || e.root>0) ? 0 : e.slow>0 ? (e.boss ? 0.75 : (e.slowV||0.5)) : 1, rm = e.shrink>0 ? 0.45 : 1,   // rm: alcance reducido
      el = e.type !== g.map.type ? liqAt(e.x, e.y) : null, lsl = (el && bio.eff.slow) || 1;
    if(el && bio.eff.dps) dot(e, bio.eff.dps*dt);
    e.x += (dx/dist*e.spd*eb(e,'spd')*sm*lsl*(1+wob*0.3) + e.kx)*dt; e.y += (dy/dist*e.spd*eb(e,'spd')*sm*lsl*(1+wob*0.3) + e.ky)*dt;
    e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
    for(const o of g.near.solid){                                             // los hostiles rodean los sólidos
      const ox = e.x-o.x, oy = e.y-o.y;
      if(Math.abs(ox) > o.r+e.r+4 || Math.abs(oy) > o.r+e.r+4) continue;
      const d = Math.hypot(ox,oy), mm = o.r + e.r*0.7;
      if(d < mm){ const nd = d||1, nx = ox/nd, ny = oy/nd; e.x = o.x + nx*mm; e.y = o.y + ny*mm;
        const side = (-ny*dx + nx*dy) >= 0 ? 1 : -1; e.x += -ny*side*e.spd*0.6*dt; e.y += nx*side*e.spd*0.6*dt; } }
    if(dist < (e.r+12)*rm) playerHit(e.dmg*eb(e,'dmg'), e.type);
    if((e.shoots || e.boss) && !(e.stun>0)){ e.shootT -= dt*eb(e,'rate');
      if(e.shootT<=0 && dist<420*rm){
        if(e.boss){ e.shootT = 2.4; const n=14, o=Math.random()*6; for(let i=0;i<n;i++) ebul(e.x,e.y,o+i*Math.PI*2/n,130,12*eb(e,'dmg'),e.type,5*rm); }
        else { e.shootT = rnd(2,3.2); ebul(e.x,e.y,Math.atan2(dy,dx),140,8*eb(e,'dmg'),e.type,5*rm); } } }
  }
  // tornados: arrastran a los enemigos hacia su centro y los dañan a intervalos
  for(const tn of g.tornados){ tn.t -= dt; tn.tick -= dt; const hit = tn.tick <= 0; if(hit) tn.tick = 0.45;
    for(const e of g.enemies){ const dx = tn.x-e.x, dy = tn.y-e.y, dist = Math.hypot(dx,dy);
      if(dist > tn.R*1.8) continue;
      if(dist > 8){ const pull = e.boss ? 60 : 210; e.x += dx/dist*pull*dt; e.y += dy/dist*pull*dt; }
      if(hit && dist < tn.R) hurt(e, tn.d*0.5, 'dragon', true); } }
  g.tornados = g.tornados.filter(t => t.t>0);
  // proyectiles propios
  for(const p of g.proj){
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    for(const o of g.near.dest){ if(o.dead || (p.ho && p.ho.includes(o))) continue;
      if((o.x-p.x)**2 + (o.y-p.y)**2 < (o.r+p.r)**2){ (p.ho = p.ho || []).push(o); hitObs(o, p.dmg); } }
    for(const e of g.enemies){ if(e.dead || p.hit.includes(e)) continue;
      if((e.x-p.x)**2+(e.y-p.y)**2 < (e.r+p.r)**2){ hurt(e,p.dmg,p.mt); p.hit.push(e); p.pierce--; if(p.pierce<=0){ p.life=0; break; } } }
  }
  // balas enemigas
  for(const b of g.ebul){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if((b.x-g.px)**2+(b.y-g.py)**2 < (b.r+10)**2){ playerHit(b.dmg, b.type); b.life=0; } }
  // gemas / monedas con imán
  const R = 60*m.mag;
  for(const gm of g.gems){ const dx=g.px-gm.x, dy=g.py-gm.y, d=Math.hypot(dx,dy);
    if(d < R || gm.pull){ gm.pull = gm.pull || d<R; const s = 320; gm.x += dx/(d||1)*s*dt; gm.y += dy/(d||1)*s*dt; }
    if(d < 14){ gm.got = true; if(gm.coin){ g.coins += gm.c; beep(1200,0.05,'triangle',0.03); } else { addXP(gm.v); sfx.gem(); } } }
  // limpieza
  g.enemies = g.enemies.filter(e => !e.dead && (e.x-g.px)**2+(e.y-g.py)**2 < 1400*1400);
  g.proj = g.proj.filter(p => p.life>0);
  g.ebul = g.ebul.filter(b => b.life>0);
  g.gems = g.gems.filter(x => !x.got);
  for(const f of g.fx) f.t -= dt; g.fx = g.fx.filter(f => f.t>0);
  for(const x of g.txt){ x.t -= dt; x.y -= 24*dt; } g.txt = g.txt.filter(x => x.t>0);
  if(g.banner){ g.banner.t -= dt; if(g.banner.t<=0) g.banner = null; }
  // cámara suave
  g.cam.x += (g.px-g.cam.x)*Math.min(1, dt*8); g.cam.y += (g.py-g.cam.y)*Math.min(1, dt*8);
  if(g.pending.length && !g.over) openLevelUp();
}
function ebul(x,y,a,s,dmg,type,life=5){ G.ebul.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:5,dmg,life,type}); }

/* ---------- Subida de nivel ---------- */
let curOffer = null;
function offerOptions(lvl){
  const o = [];
  // Nivel 5/15/25: objeto. Nivel 10/20/30: Vínculo (si hay ≥2 huecos).
  if(lvl % 10 === 5) return {kind:'item', opts:shuffle(Object.keys(ITEMS)).slice(0,2).map(id => ({k:'item', id}))};
  if(lvl % 10 === 0 && G.moves.length >= 2){
    const pairs = [];
    for(let i=0;i<G.moves.length;i++) for(let j=0;j<G.moves.length;j++) if(i!==j) pairs.push({k:'link',a:i,b:j});
    return {kind:'link', opts:shuffle(pairs).slice(0,3)};
  }
  for(const gr of G.moves) for(const m of [gr,...gr.links]) if(m.lvl<5) o.push({k:'up', m});
  if(G.moves.length < 4) for(const id of Object.keys(MOVES)) if(!flat().some(m => m.id===id)) o.push({k:'new', id});
  o.push({k:'heal'});
  // pasivas: mejorar las que ya tienes, o una nueva si quedan huecos y su rama no está bloqueada
  const held = Object.keys(G.pas);
  for(const id of Object.keys(PASSIVES)){ const L = pl(id);
    if(L >= PAS_MAX) continue;
    if(L === 0 && (held.length >= PAS_SLOTS || branchLocked(PASSIVES[id].branch))) continue;
    o.push({k:'pas', id}); }
  // en una misma oferta nunca salen dos pasivas de ramas opuestas
  const out = [];
  for(const c of shuffle(o)){
    if(c.k==='pas' && out.some(x => x.k==='pas' && PASSIVES[x.id].branch === BRANCHES[PASSIVES[c.id].branch].opp)) continue;
    out.push(c); if(out.length === 3) break; }
  return {kind:'normal', opts:out};
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function describe(o){
  const tag = id => { const t = TYPES[MOVES[id].type]; return `<span class="tag" style="background:${t.c}">${t.n}</span>`; };
  switch(o.k){
    case 'up':   return `<b>${moveName(o.m)}</b>${tag(o.m.id)}<small>Nivel ${o.m.lvl} → ${o.m.lvl+1}${o.m.lvl+1>=5?' · ¡EVOLUCIONA!':''}<br>${MOVES[o.m.id].desc}</small>`;
    case 'new':  return `<b>${MOVES[o.id].name}</b>${tag(o.id)}<small>${MOVES[o.id].desc}<br>${chartTxt(MOVES[o.id].type)}</small>`;
    case 'heal': return `<b>Cura</b><small>Recupera el 40% de la vida</small>`;
    case 'pas':  { const ps = PASSIVES[o.id], br = BRANCHES[ps.branch], L = pl(o.id);
      const lock = L===0 && !Object.keys(G.pas).some(i => PASSIVES[i].branch===ps.branch) ? ` · Bloquea ${BRANCHES[br.opp].n}` : '';
      return `<b>${ps.name}</b><span class="tag" style="background:${br.c};color:#111">${br.n}</span><small>${L?`Nivel ${L} → ${L+1}`:'Nueva pasiva'}${lock}<br>${ps.desc}</small>`; }
    case 'item': return `<b>${ITEMS[o.id].name}</b><small>${ITEMS[o.id].desc}</small>`;
    case 'link': return `<b>${moveName(G.moves[o.a])} + ${moveName(G.moves[o.b])}</b><small>Se lanzan a la vez y ocupan un solo hueco</small>`;
  }
}
function openLevelUp(offer){
  G.paused = true;
  const lvl = G.pending[0];
  if(!offer) offer = offerOptions(lvl);
  curOffer = offer;
  const titles = {normal:`¡Nivel ${lvl}!`, item:'¡Un objeto!', link:'¡Vínculo!'};
  const subs = {normal:'Elige una recompensa · 1 2 3', item:'Sólo puedes llevar uno' + (G.item?` (llevas: ${ITEMS[G.item].name})`:''), link:'Los movimientos unidos se lanzan a la vez y ocupan un solo hueco'};
  $('#lTitle').textContent = titles[offer.kind]; $('#lSub').textContent = subs[offer.kind];
  const box = $('#lCards'); box.innerHTML = '';
  offer.opts.forEach((o,i) => { const b = document.createElement('button'); b.className='card'; b.innerHTML = `<span class="k">${i+1}</span>${describe(o)}`;
    b.onclick = () => chooseOffer(o); box.appendChild(b); });
  $('#lReroll').style.display = offer.kind==='normal' ? '' : 'none';
  $('#lReroll').textContent = `Cambiar opciones (${G.rerolls}) · R`; $('#lReroll').disabled = G.rerolls<=0;
  $('#lSkip').style.display = offer.kind!=='normal' ? '' : 'none';
  $('#ovLvl').classList.add('on'); sfx.lvl();
}
function chooseOffer(o){
  switch(o.k){
    case 'up': o.m.lvl++; break;
    case 'new': G.moves.push({id:o.id, lvl:1, t:0.3, links:[]}); break;
    case 'heal': G.hp = Math.min(G.maxhp, G.hp + G.maxhp*0.4); break;
    case 'pas': { const ps = PASSIVES[o.id], first = !Object.keys(G.pas).some(i => PASSIVES[i].branch===ps.branch);
      G.pas[o.id] = pl(o.id) + 1;
      if(o.id==='vigor') recalcMax();
      if(first) G.banner = {s:`Rama ${BRANCHES[ps.branch].n}: ${BRANCHES[BRANCHES[ps.branch].opp].n} bloqueada`, t:3}; break; }
    case 'item': G.item = o.id; break;
    case 'link': { const A = G.moves[o.a], B = G.moves[o.b]; A.links.push(B, ...B.links); B.links = []; G.moves.splice(o.b,1); G.sel = 0; break; }
  }
  closeLevelUp();
}
function closeLevelUp(){
  G.pending.shift(); $('#ovLvl').classList.remove('on'); G.paused = false;
  if(G.pending.length) openLevelUp();
}

/* ---------- Fin de run ---------- */
function endRun(){
  if(G.over) return; G.over = true; sfx.die();
  const earned = Math.floor((G.coins + Math.floor(G.t/30) + Math.floor(G.kills/20)) );

    `<div class="stat"><span>Derrotados</span><b>${G.kills}</b></div><div class="stat"><span>Monedas ganadas</span><b class="coin">+${earned}</b></div>` +
    (Object.keys(G.pas).length ? `<div class="stat"><span>Pasivas</span><b>${Object.keys(G.pas).map(i => PASSIVES[i].name+' '+G.pas[i]).join(', ')}</b></div>` : '') +

/* ---------- 7. DIBUJO ---------- */
function bgTile(x,y){ const h = (x*374761393 + y*668265263) >>> 0; return (h ^ (h>>>13)) * 1274126177 >>> 0; }

    if(h%23===0){ ctx.fillStyle=mp.d2; ctx.fillRect(tx*T+(h>>5)%36, ty*T+(h>>9)%36, 3, 3); }
  }
  // obstáculos: líquidos en el suelo, luego sólidos
  const bio = BIOME[mp.type], seen = [];

    for(const o of getChunk(i,j)) if(!o.dead && o.x > cx-90 && o.x < cx+vw+90 && o.y > cy-90 && o.y < cy+vh+90) seen.push(o);
  seen.sort((a,b) => a.y - b.y);

  for(const o of seen) if(o.k==='montana') drawMountain(o, bio); else if(o.k==='arbol') drawTree(o, bio, g.t); else if(o.k==='piedra') drawRock(o, bio);
  // gemas

    else { ctx.fillStyle = gm.v>=10?'#ff6ad5':'#5ad7ff'; ctx.save(); ctx.translate(gm.x,gm.y); ctx.rotate(Math.PI/4); ctx.fillRect(-3,-3,6,6); ctx.restore(); } }
  // enemigos

    ctx.restore();

    { let n = 0; for(const [k,c] of STATUS_COL) if(e[k] > 0){ ctx.fillStyle = c; ctx.fillRect(e.x-9+n*7, e.y+sz/2+1, 5, 5); n++; } }
  }

  for(const m of flat()) if(m.id==='orbita' && m._orbs) for(const o of m._orbs){ ctx.fillStyle=TYPES.sombra.c; ctx.beginPath(); ctx.arc(o.x,o.y,8,0,7); ctx.fill(); ctx.fillStyle='#d9b8ff'; ctx.beginPath(); ctx.arc(o.x-2,o.y-2,3,0,7); ctx.fill(); }
  // jugador
  { const s = spriteOf(g.sp, g.shiny), sz = 34;
    if(!(g.inv>0 && Math.floor(g.t*20)%2)){

      ctx.globalAlpha=0.3; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(0,15,13,5,0,0,7); ctx.fill(); ctx.globalAlpha=1;
      if(mp.type===g.sp.type){ ctx.strokeStyle='#7be061'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,24+Math.sin(g.t*6)*1.5,0,7); ctx.stroke(); }

  for(const b of g.ebul){ ctx.fillStyle='#ff4d6d'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke(); }

    if(f.k==='bolt'){ ctx.strokeStyle=f.col; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(f.x+rnd(-8,8),f.y-200); ctx.lineTo(f.x+rnd(-10,10),f.y-100); ctx.lineTo(f.x+rnd(-10,10),f.y-40); ctx.lineTo(f.x,f.y); ctx.stroke(); }
  }
  ctx.font = 'bold 12px ui-monospace,monospace'; ctx.textAlign='center';
  for(const x of g.txt){ ctx.globalAlpha=Math.min(1,x.t*3); ctx.fillStyle='#000'; ctx.fillText(x.s,x.x+1,x.y+1); ctx.fillStyle=x.c||'#fff'; ctx.fillText(x.s,x.x,x.y); } ctx.globalAlpha=1;

  if(g.vis > 0.02){                                                         // dentro de hierba alta: visión reducida
    ctx.setTransform(1,0,0,1,0,0);
    const sx = (g.px-Math.round(cx))*Z, sy = (g.py-Math.round(cy))*Z, gr = ctx.createRadialGradient(sx,sy,0,sx,sy,240*Z);
    gr.addColorStop(0, 'rgba(8,12,10,0)'); gr.addColorStop(0.4, 'rgba(8,12,10,0)'); gr.addColorStop(1, `rgba(8,12,10,${0.93*g.vis})`);

}
function drawLiquid(o, B, t){
  const [c1,c2] = B.liq; ctx.fillStyle = c1; ctx.beginPath(); ctx.ellipse(o.x,o.y,o.r,o.r*0.65,0,0,7); ctx.fill();

function drawMountain(o, B){

    ctx.fillStyle = d; ctx.beginPath(); ctx.moveTo(px,py-h); ctx.lineTo(px+w,py); ctx.lineTo(px+w*0.15,py); ctx.closePath(); ctx.fill();
    ctx.fillStyle = tip; ctx.beginPath(); ctx.moveTo(px,py-h); ctx.lineTo(px-w*0.28,py-h*0.72); ctx.lineTo(px+w*0.1,py-h*0.78); ctx.lineTo(px+w*0.28,py-h*0.72); ctx.closePath(); ctx.fill(); };

function drawTree(o, B, t){

    ctx.moveTo(x,y-14); ctx.lineTo(x-14,y-30); ctx.moveTo(x,y-20); ctx.lineTo(x+13,y-34); ctx.moveTo(x,y-8); ctx.lineTo(x+12,y-18); ctx.stroke(); return; }

  openPanel('Mejoras', h);
  $('#pBody').querySelectorAll('button[data-u]').forEach(b => b.onclick = () => {
    const u = UPGRADES.find(x => x.id===b.dataset.u), c = upCost(u);
    if(SAVE.coins>=c && SAVE.up[u.id]<MAX_UP){ SAVE.coins -= c; SAVE.up[u.id]++; persist(); refreshMenu(); panelUpgrades(); beep(660,0.1,'triangle',0.05); } });
}
function gachaRoll(){
  const sp = pick(SPECIES), o = SAVE.owned[sp.id];
  if(!o){ SAVE.owned[sp.id] = {shiny: Math.random()<0.05}; return `¡Nuevo compañero: <b>${sp.name}</b>${SAVE.owned[sp.id].shiny?' ✨ shiny':''}!`; }
  if(!o.shiny && Math.random()<0.10){ o.shiny = true; return `¡<b>${sp.name}</b> shiny! ✨`; }
  SAVE.coins += 40; return `${sp.name} repetido → +40 monedas`;
}
function panelGacha(msg=[]){
  openPanel('Gacha', `<p class="sub">Monedas: <span class="coin">${SAVE.coins}</span> · Compañeros nuevos y versiones shiny</p>
    <div class="menu"><button id="g1" ${SAVE.coins<100?'disabled':''}>Tirar ×1 · ● 100</button><button id="g10" ${SAVE.coins<900?'disabled':''}>Tirar ×10 · ● 900</button></div>
    <div style="margin-top:14px">${msg.map(m => `<div class="stat"><span>${m}</span></div>`).join('')}</div>`);
  const go = (n, cost) => () => { if(SAVE.coins<cost) return; SAVE.coins -= cost; const r=[]; for(let i=0;i<n;i++) r.push(gachaRoll()); persist(); refreshMenu(); sfx.lvl(); panelGacha(r); };
  $('#g1').onclick = go(1,100); $('#g10').onclick = go(10,900);
}
function drawDex(canvas, d){                       // sprite de una ficha (los jefes son de 12x12 celdas)
  const grid = d.big ? 12 : 10, spr = d.role==='Compañero' ? spriteOf(SPECIES.find(x => x.id===d.id), SAVE.owned[d.id] && SAVE.owned[d.id].shiny) : makeSprite(d.seed, d.hue, false, grid, 3);
  canvas.width = canvas.height = 36; const k = canvas.getContext('2d'); k.imageSmoothingEnabled = false; k.clearRect(0,0,36,36);
  k.drawImage(spr, (36-spr.width)/2, (36-spr.height)/2);
}
function panelDex(tab='c'){
  const C = SAVE.dex.c, got = DEX.filter(d => C[d.id] && C[d.id].seen).length, mg = MAPS.filter(m => SAVE.dex.m[m.id]).length;
  openPanel('Criaturario', `<div class="row"><div><button data-t="c" class="${tab==='c'?'sel':''}">Criaturas ${got}/${DEX.length}</button>
    <button data-t="m" class="${tab==='m'?'sel':''}">Mapas ${mg}/${MAPS.length}</button></div></div>
    <p class="hint" style="text-align:left">Se desbloquean al descubrirlas: hostiles y legendarios al verlos de cerca, compañeros al conseguirlos, mapas al visitarlos.</p>
    <div class="grid" id="dg"></div>`);
  $('#pBody').querySelectorAll('button[data-t]').forEach(b => b.onclick = () => panelDex(b.dataset.t));
  const box = $('#dg');
  if(tab === 'c') DEX.forEach(d => {
    const e = C[d.id], ok = e && e.seen, t = TYPES[d.type], card = document.createElement('div'); card.className = 'dcard';
    const cv2 = document.createElement('canvas'); cv2.style.cssText = 'width:72px;height:72px;image-rendering:pixelated'; if(!ok) cv2.className = 'sil';
    drawDex(cv2, d); card.appendChild(cv2);
    if(!ok){ card.insertAdjacentHTML('beforeend', '<b>???</b><small>Sin descubrir</small>'); }
    else card.insertAdjacentHTML('beforeend', `<b>${d.name}${e.shiny?' ✨':''}</b>
      <span><span class="tag" style="background:${t.c}">${t.n}</span><span class="tag" style="background:#ddd">${d.role}</span></span>
      <small>Especialidad: ${TYPE_BUFF[d.type].label} (×${MAP_BUFF} en su mapa)<br>${chartTxt(d.type)}<br>Vida ${d.hp} · Vel ${d.spd}<br>${d.note}</small>
      <small>${DESC[d.id]}</small>${d.role==='Compañero' ? '' : `<small>Derrotados: <b>${e.kills||0}</b></small>`}`);
    box.appendChild(card);
  });
  else MAPS.forEach(m => {
    const ok = SAVE.dex.m[m.id], t = TYPES[m.type], card = document.createElement('div'); card.className = 'dcard';
    card.insertAdjacentHTML('beforeend', `<div style="width:72px;height:72px;border-radius:6px;background:${ok?`linear-gradient(135deg,${m.a} 50%,${m.b} 50%)`:'#111'};border:3px solid ${ok?t.c:'#333'}"></div>` +
      (ok ? `<b>${m.name}</b><span class="tag" style="background:${t.c}">${t.n}</span><small>Favorece a las criaturas de tipo ${t.n}: ×${MAP_BUFF} en ${TYPE_BUFF[m.type].label}</small>
      <small>Montañas: ${BIOME[m.type].n.mont} · Árboles: ${BIOME[m.type].n.arbol}<br>Piedras: ${BIOME[m.type].n.piedra} · Hierba: ${BIOME[m.type].n.hierba}<br>${BIOME[m.type].n.liq}: ${BIOME[m.type].eff.dps ? BIOME[m.type].eff.dps+' de daño por segundo' : 'velocidad ×'+BIOME[m.type].eff.slow}, salvo tipo ${t.n}</small>` : '<b>???</b><small>Sin visitar</small>'));
    box.appendChild(card);
  });
}
function panelStats(){
  const s = SAVE.stats;
  openPanel('Estadísticas', [['Runs',s.runs],['Mejor tiempo',fmtT(s.bestT)],['Mejor nivel',s.bestL],['Enemigos derrotados',s.kills],
    ['Compañeros',Object.keys(SAVE.owned).length+' / '+SPECIES.length],['Shinies',Object.values(SAVE.owned).filter(o=>o.shiny).length]]
    .map(([a,b]) => `<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('') +
    '<div class="center" style="margin-top:14px"><button id="bReset">Borrar toda la partida</button></div>');
  $('#bReset').onclick = () => { if(confirm('¿Borrar todo el progreso?')){ SAVE = defaultSave(); persist(); refreshMenu(); hide('#ovPanel'); } };
}
function panelGuide(){
  openPanel('Guía', `<div class="stat"><span>Moverse</span><b>WASD / flechas / arrastrar el dedo</b></div>
    <div class="stat"><span>Atacar</span><b>Automático</b></div>
    <div class="stat"><span>Movimiento principal</span><b>1–4 · Q/E (+25% daño)</b></div>
    <div class="stat"><span>Pausa</span><b>Esc</b></div>
    <p class="hint" style="text-align:left;font-size:14px">Recoge gemas azules para subir de nivel y elige mejoras. Al nivel 5 de un movimiento evoluciona.
    Niveles 5, 15, 25…: objeto (sólo uno). Niveles 10, 20, 30…: Vínculo, que une dos movimientos en un hueco.
    Cada 4 minutos aparece un legendario. Cada 75 segundos cambia el mapa: las criaturas del tipo del mapa (tú también) ganan ×1.2 en su especialidad. Mira el Criaturario para ver todas.
    Además de movimientos hay pasivas, que mejoran sin disparar nada. Se agrupan en ramas (Agilidad, Fortaleza, Poder, Ingenio) y las opuestas se excluyen: al coger una de Agilidad ya no salen las de Fortaleza, y al coger una de Poder ya no salen las de Ingenio. Puedes llevar 4 pasivas, hasta nivel 5.
    Cada tipo es fuerte contra uno y débil contra otro (Fuego > Planta > Agua > Fuego y Eléctrico > Dragón > Sombra > Eléctrico): ×1.3 a favor y ×0.75 en contra, tanto en tus ataques como en los suyos. Los movimientos de control aplican un estado a los hostiles (puntitos de color bajo ellos): Marea los ralentiza, Raíces los inmoviliza, Estática los paraliza, Brasas los quema, Niebla reduce su alcance y Ciclón los arrastra y junta. Los legendarios resisten: ni se inmovilizan ni se paralizan.
    El mundo tiene obstáculos que cambian de aspecto con el mapa: montañas y árboles son sólidos e indestructibles (se rodean); las piedras son sólidas pero se rompen con tus ataques (a veces sueltan una moneda); la hierba alta se atraviesa, pero dentro reduce la visión y también se rompe; y los líquidos (lava, aguas, pantano…) dañan o ralentizan a todos menos a las criaturas del tipo del mapa. Las monedas sirven para mejoras permanentes y el Gacha.</p>`);
}
function setSound(v){ SAVE.sound = v; persist(); $('#bSound').textContent = 'Sonido: ' + (v?'sí':'no'); $('#bSnd2').textContent = 'Sonido: ' + (v?'sí':'no'); }

$('#bPlay').onclick = () => { newRun(); beep(600,0.1,'square',0.04); };
$('#bAgain').onclick = () => newRun();
$('#bMenu').onclick = () => { G = null; hide('#ovOver'); show('#ovMenu'); refreshMenu(); };
$('#bComp').onclick = panelCompanions; $('#bUp').onclick = panelUpgrades; $('#bGacha').onclick = () => panelGacha();
$('#bStats').onclick = panelStats; $('#bDex').onclick = () => panelDex(); $('#bGuide').onclick = panelGuide;
$('#pBack').onclick = () => hide('#ovPanel');
$('#bSound').onclick = $('#bSnd2').onclick = () => setSound(!SAVE.sound);
$('#bResume').onclick = () => togglePause(false);
$('#bQuit').onclick = () => { hide('#ovPause'); G.paused=false; G.hp = 0; endRun(); };
$('#lReroll').onclick = () => { if(G.rerolls>0 && curOffer.kind==='normal'){ G.rerolls--; openLevelUp(offerOptions(G.pending[0])); } };
$('#lSkip').onclick = closeLevelUp;

function togglePause(v){
  if(!G || G.over || $('#ovLvl').classList.contains('on')) return;
  G.paused = v===undefined ? !G.paused : v;
  $('#ovPause').classList.toggle('on', G.paused);
}

/* ---------- Entrada ---------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(!G) return;
  if($('#ovLvl').classList.contains('on')){
    if(['1','2','3'].includes(k) && curOffer.opts[+k-1]) chooseOffer(curOffer.opts[+k-1]);
    if(k==='r') $('#lReroll').click();
    return;
  }
  if(k==='escape') togglePause();
  if(G.paused) return;
  if(['1','2','3','4'].includes(k) && G.moves[+k-1]) G.sel = +k-1;
  if(k==='q') G.sel = (G.sel-1+G.moves.length)%G.moves.length;
  if(k==='e') G.sel = (G.sel+1)%G.moves.length;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k]=false; if(G && !G.over) togglePause(true); });
cv.addEventListener('pointerdown', e => { if(e.pointerType==='touch' || e.pointerType==='pen'){ touch = {ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); } });
cv.addEventListener('pointermove', e => { if(touch){ touch.x=e.clientX; touch.y=e.clientY; } });
const endTouch = () => { touch = null; };
cv.addEventListener('pointerup', endTouch); cv.addEventListener('pointercancel', endTouch);

/* ---------- 9. BUCLE PRINCIPAL ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if(G){ if(!G.paused && !G.over) update(dt); draw(); }
  else { ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#1b1528'; ctx.fillRect(0,0,cv.width,cv.height); }
  requestAnimationFrame(frame);
}
refreshMenu();
requestAnimationFrame(frame);
</script>
</body>
